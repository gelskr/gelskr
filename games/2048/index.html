<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 20px; background: #101010; color: #f5f5f5;
    font-family: system-ui, sans-serif;
  }
  .game { width: min(100%, 440px); }
  header { display: flex; justify-content: space-between; align-items: end; }
  h1 { margin: 0; font-size: 42px; letter-spacing: -.06em; }
  p { margin: 5px 0 0; color: #999; font-size: 13px; }
  .score { text-align: right; color: #999; font-size: 12px; }
  .score strong { display: block; color: white; font-size: 24px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; }
  button {
    border: 1px solid #383838; border-radius: 9px; padding: 9px 14px;
    background: #222; color: white; font: inherit; cursor: pointer;
  }
  button:hover { background: #333; }
  #status { color: #aaa; font-size: 13px; }
  .board {
    position: relative; aspect-ratio: 1; padding: 8px;
    border: 1px solid #333; border-radius: 14px;
    background: #1b1b1b; touch-action: none;
  }
  .grid, .tiles {
    position: absolute; inset: 8px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr); gap: 8px;
  }
  .cell { border-radius: 9px; background: #292929; }
  .tile {
    position: absolute;
    width: calc((100% - 24px) / 4);
    height: calc((100% - 24px) / 4);
    left: calc(var(--c) * (100% + 8px) / 4);
    top: calc(var(--r) * (100% + 8px) / 4);
    transition: left 120ms ease-in-out, top 120ms ease-in-out;
  }
  .tile span {
    width: 100%; height: 100%; display: grid; place-items: center;
    border-radius: 9px; color: white; font-size: clamp(20px, 6vw, 35px);
    font-weight: 750; background: #af9148;
  }
  .v2 span { background: #454545; }
  .v4 span { background: #595959; }
  .v8 span { background: #806148; }
  .v16 span { background: #a66d42; }
  .v32 span { background: #bc704b; }
  .v64 span { background: #c75e4a; }
  .high span { font-size: clamp(17px, 5vw, 29px); }
  .new span { animation: appear 160ms ease-out; }
  .merged span { animation: pop 180ms ease-out; }
  .hint { text-align: center; margin-top: 14px; }
  @keyframes appear { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes pop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile span { animation: none !important; }
  }
</style>
</head>
<body>
<div class="game">
  <header>
    <div><h1>2048</h1><p>Combine matching tiles.</p></div>
    <div class="score">SCORE<strong id="score">0</strong></div>
  </header>
  <div class="bar">
    <span id="status" aria-live="polite"></span>
    <button id="reset">New game</button>
  </div>
  <div class="board" id="board" aria-label="2048 game board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <p class="hint">Arrow keys / WASD · Swipe on mobile</p>
</div>

<script>
const tilesEl = document.getElementById("tiles");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");
const boardEl = document.getElementById("board");
const gridEl = document.getElementById("grid");

for (let i = 0; i < 16; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  gridEl.appendChild(cell);
}

let board, score, won, over, busy, generation = 0;

function makeTile(value, r, c, animation = "") {
  const el = document.createElement("div");
  const label = document.createElement("span");
  el.className = `tile ${value <= 64 ? "v" + value : "high"} ${animation}`;
  label.textContent = value;
  el.appendChild(label);
  tilesEl.appendChild(el);
  const tile = { value, r, c, el };
  position(tile, r, c);
  return tile;
}

function position(tile, r, c) {
  tile.r = r;
  tile.c = c;
  tile.el.style.setProperty("--r", r);
  tile.el.style.setProperty("--c", c);
}

function addTile() {
  const empty = [];
  for (let r = 0; r < 4; r++)
    for (let c = 0; c < 4; c++)
      if (!board[r][c]) empty.push([r, c]);

  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = makeTile(Math.random() < 0.9 ? 2 : 4, r, c, "new");
}

function updateStatus() {
  scoreEl.textContent = score;
  statusEl.textContent = over ? "Game over" : won ? "2048 reached! Keep going." : "";
}

function reset() {
  generation++;
  tilesEl.replaceChildren();
  board = Array.from({ length: 4 }, () => Array(4).fill(null));
  score = 0;
  won = false;
  over = false;
  busy = false;
  addTile();
  addTile();
  updateStatus();
}

function canMove() {
  for (let r = 0; r < 4; r++) {
    for (let c = 0; c < 4; c++) {
      const tile = board[r][c];
      if (!tile) return true;
      if (r < 3 && tile.value === board[r + 1][c]?.value) return true;
      if (c < 3 && tile.value === board[r][c + 1]?.value) return true;
    }
  }
  return false;
}

function move(direction) {
  if (busy || over) return;

  const next = Array.from({ length: 4 }, () => Array(4).fill(null));
  const merges = [];
  let changed = false;

  for (let i = 0; i < 4; i++) {
    const coords = Array.from({ length: 4 }, (_, j) => {
      if (direction === "left") return [i, j];
      if (direction === "right") return [i, 3 - j];
      if (direction === "up") return [j, i];
      return [3 - j, i];
    });

    const line = coords.map(([r, c]) => board[r][c]).filter(Boolean);
    let dest = 0;

    for (let j = 0; j < line.length; j++) {
      const tile = line[j];
      const [r, c] = coords[dest++];

      if (tile.r !== r || tile.c !== c) changed = true;
      position(tile, r, c);

      if (line[j + 1] && line[j + 1].value === tile.value) {
        const other = line[++j];
        position(other, r, c);
        merges.push({ tile, other, r, c, value: tile.value * 2 });
        next[r][c] = tile;
        changed = true;
      } else {
        next[r][c] = tile;
      }
    }
  }

  if (!changed) {
    over = !canMove();
    updateStatus();
    return;
  }

  busy = true;
  board = next;
  const currentGeneration = generation;

  setTimeout(() => {
    if (currentGeneration !== generation) return;

    for (const merge of merges) {
      merge.tile.el.remove();
      merge.other.el.remove();
      board[merge.r][merge.c] = makeTile(
        merge.value, merge.r, merge.c, "merged"
      );
      score += merge.value;
      if (merge.value >= 2048) won = true;
    }

    addTile();
    over = !canMove();
    busy = false;
    updateStatus();
  }, 120);
}

document.addEventListener("keydown", event => {
  const keys = {
    arrowleft: "left", a: "left",
    arrowright: "right", d: "right",
    arrowup: "up", w: "up",
    arrowdown: "down", s: "down"
  };
  const direction = keys[event.key.toLowerCase()];
  if (direction) {
    event.preventDefault();
    move(direction);
  }
});

let startTouch = null;
boardEl.addEventListener("touchstart", event => {
  const t = event.touches[0];
  startTouch = { x: t.clientX, y: t.clientY };
}, { passive: true });

boardEl.addEventListener("touchend", event => {
  if (!startTouch) return;
  const t = event.changedTouches[0];
  const dx = t.clientX - startTouch.x;
  const dy = t.clientY - startTouch.y;
  startTouch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  move(Math.abs(dx) > Math.abs(dy)
    ? (dx > 0 ? "right" : "left")
    : (dy > 0 ? "down" : "up"));
}, { passive: true });

document.getElementById("reset").addEventListener("click", reset);
reset();
</script>
</body>
</html>
