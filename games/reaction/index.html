<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Test</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 20px; background: #101010; color: #f5f5f5;
    font-family: system-ui, sans-serif;
  }
  .game { width: min(100%, 480px); }
  header { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -.05em; }
  p { margin: 5px 0 0; color: #999; font-size: 13px; }
  .best { text-align: right; color: #999; font-size: 12px; white-space: nowrap; }
  .best strong { display: block; color: white; font-size: 20px; }
  #area {
    width: 100%; min-height: 300px; margin-top: 20px; padding: 24px;
    border: 1px solid #383838; border-radius: 14px;
    background: #242424; color: white; cursor: pointer;
    font: inherit; transition: background .15s;
  }
  #area.waiting { background: #8a4141; }
  #area.ready { background: #397d53; }
  #title { display: block; font-size: 28px; font-weight: 750; }
  #detail { display: block; margin-top: 10px; color: #ddd; font-size: 14px; }
  .hint { text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="game">
  <header>
    <div><h1>Reaction Test</h1><p>How fast are your reflexes?</p></div>
    <div class="best">BEST<strong id="best">—</strong></div>
  </header>
  <button id="area" type="button">
    <span id="title">Ready?</span>
    <span id="detail">Click or tap to start.</span>
  </button>
  <p class="hint">Wait for green, then react as quickly as possible.</p>
</div>

<script>
const area = document.getElementById("area");
const title = document.getElementById("title");
const detail = document.getElementById("detail");
const bestEl = document.getElementById("best");

let state = "idle";
let timer;
let startTime;
let best = null;

function showBest() {
  bestEl.textContent = best === null ? "—" : `${best} ms`;
}

area.addEventListener("click", () => {
  if (state === "idle" || state === "result") {
    state = "waiting";
    area.className = "waiting";
    title.textContent = "Wait for green...";
    detail.textContent = "Don't click yet.";

    timer = setTimeout(() => {
      state = "ready";
      area.className = "ready";
      title.textContent = "Click now!";
      detail.textContent = "";
      startTime = performance.now();
    }, 1500 + Math.random() * 3500);

  } else if (state === "waiting") {
    clearTimeout(timer);
    state = "result";
    area.className = "";
    title.textContent = "Too soon!";
    detail.textContent = "Click to try again.";

  } else if (state === "ready") {
    const result = Math.round(performance.now() - startTime);
    if (best === null || result < best) best = result;
    showBest();
    state = "result";
    area.className = "";
    title.textContent = `${result} ms`;
    detail.textContent = "Click to play again.";
  }
});

showBest();
</script>
</body>
</html>
