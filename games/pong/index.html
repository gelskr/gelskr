<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pong</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 20px; background: #101010; color: #f5f5f5;
    font-family: system-ui, sans-serif;
  }
  .game { width: min(100%, 600px); }
  header { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
  h1 { margin: 0; font-size: 36px; letter-spacing: -.05em; }
  p { margin: 5px 0 0; color: #999; font-size: 13px; }
  button {
    border: 1px solid #383838; border-radius: 9px; padding: 9px 14px;
    background: #222; color: white; font: inherit; cursor: pointer;
  }
  button:hover { background: #333; }
  canvas {
    display: block; width: 100%; height: auto; margin-top: 20px;
    border: 1px solid #333; border-radius: 12px;
    background: #191919; touch-action: none;
  }
  .hint { text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="game">
  <header>
    <div><h1>Pong</h1><p>First to 5 wins.</p></div>
    <button id="reset">New game</button>
  </header>
  <canvas id="game" width="600" height="400" aria-label="Pong game"></canvas>
  <p class="hint">W / S or arrow keys · Drag on mobile</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const paddleH = 75, paddleW = 10, ballSize = 10;
const keys = new Set();
let player, computer, ball, playerScore, computerScore, finished, lastTime;

function serve(direction) {
  ball = {
    x: W / 2, y: H / 2,
    vx: 260 * direction,
    vy: (Math.random() * 160) - 80
  };
}

function reset() {
  player = (H - paddleH) / 2;
  computer = player;
  playerScore = 0;
  computerScore = 0;
  finished = false;
  lastTime = 0;
  serve(Math.random() < 0.5 ? -1 : 1);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function update(dt) {
  if (finished) return;

  if (keys.has("w") || keys.has("arrowup")) player -= 340 * dt;
  if (keys.has("s") || keys.has("arrowdown")) player += 340 * dt;
  player = clamp(player, 0, H - paddleH);

  const target = ball.y - paddleH / 2;
  computer += clamp(target - computer, -240 * dt, 240 * dt);
  computer = clamp(computer, 0, H - paddleH);

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  if (ball.y <= 0 || ball.y + ballSize >= H) {
    ball.y = clamp(ball.y, 0, H - ballSize);
    ball.vy *= -1;
  }

  if (ball.vx < 0 && ball.x <= 30 + paddleW &&
      ball.x + ballSize >= 30 &&
      ball.y + ballSize >= player && ball.y <= player + paddleH) {
    ball.x = 30 + paddleW;
    ball.vx = Math.min(Math.abs(ball.vx) * 1.05, 480);
    ball.vy = ((ball.y + ballSize / 2) - (player + paddleH / 2)) * 5;
  }

  const rightX = W - 30 - paddleW;
  if (ball.vx > 0 && ball.x + ballSize >= rightX &&
      ball.x <= rightX + paddleW &&
      ball.y + ballSize >= computer && ball.y <= computer + paddleH) {
    ball.x = rightX - ballSize;
    ball.vx = -Math.min(Math.abs(ball.vx) * 1.05, 480);
    ball.vy = ((ball.y + ballSize / 2) - (computer + paddleH / 2)) * 5;
  }

  if (ball.x + ballSize < 0) {
    computerScore++;
    if (computerScore >= 5) finished = true;
    else serve(-1);
  } else if (ball.x > W) {
    playerScore++;
    if (playerScore >= 5) finished = true;
    else serve(1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = "#444";
  ctx.setLineDash([8, 10]);
  ctx.beginPath();
  ctx.moveTo(W / 2, 0);
  ctx.lineTo(W / 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = "#eee";
  ctx.fillRect(30, player, paddleW, paddleH);
  ctx.fillRect(W - 30 - paddleW, computer, paddleW, paddleH);
  ctx.fillRect(ball.x, ball.y, ballSize, ballSize);

  ctx.font = "28px system-ui";
  ctx.textAlign = "center";
  ctx.fillStyle = "#888";
  ctx.fillText(playerScore, W / 2 - 40, 40);
  ctx.fillText(computerScore, W / 2 + 40, 40);

  if (finished) {
    ctx.fillStyle = "rgba(0,0,0,.75)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 28px system-ui";
    ctx.fillText(playerScore > computerScore ? "You win!" : "Computer wins", W / 2, H / 2);
    ctx.font = "16px system-ui";
    ctx.fillText("Select New game to play again", W / 2, H / 2 + 35);
  }
}

function loop(time) {
  if (!lastTime) lastTime = time;
  const dt = Math.min((time - lastTime) / 1000, 0.04);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  if (["w", "s", "arrowup", "arrowdown"].includes(key)) {
    event.preventDefault();
    keys.add(key);
  }
});
document.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
window.addEventListener("blur", () => keys.clear());

function movePointer(event) {
  const rect = canvas.getBoundingClientRect();
  player = clamp((event.clientY - rect.top) * H / rect.height - paddleH / 2, 0, H - paddleH);
}
canvas.addEventListener("pointerdown", event => {
  canvas.setPointerCapture(event.pointerId);
  movePointer(event);
});
canvas.addEventListener("pointermove", event => {
  if (canvas.hasPointerCapture(event.pointerId)) movePointer(event);
});
document.getElementById("reset").addEventListener("click", reset);

reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
