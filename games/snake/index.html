<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snake</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 20px;
      place-items: center;
      background: #101010;
      color: #f5f5f5;
    }

    .game {
      width: min(100%, 540px);
      animation: appear .6s ease both;
    }

    .top {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -.05em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: #858585;
      font-size: 13px;
    }

    .scores {
      display: flex;
      gap: 18px;
      text-align: right;
    }

    .label {
      display: block;
      color: #777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .value {
      display: block;
      margin-top: 3px;
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .board {
      position: relative;
      overflow: hidden;
      border: 1px solid #303030;
      border-radius: 16px;
      background: #181818;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 8, 8, .76);
      backdrop-filter: blur(5px);
      text-align: center;
      animation: fade .25s ease both;
    }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: 27px;
      letter-spacing: -.04em;
    }

    .overlay p {
      margin: 0 0 20px;
      color: #aaa;
      font-size: 14px;
    }

    button {
      border: 1px solid #555;
      border-radius: 9px;
      background: #f1f1f1;
      color: #111;
      padding: 10px 20px;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    button:hover { transform: translateY(-2px); background: white; }
    button:active { transform: scale(.96); }

    .hint {
      margin: 14px 0 0;
      color: #777;
      font-size: 12px;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="game">
    <div class="top">
      <div>
        <h1>Snake</h1>
        <p class="subtitle">Eat, grow, and beat your best.</p>
      </div>

      <div class="scores">
        <div>
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div>
          <span class="label">Best</span>
          <span id="best" class="value">0</span>
        </div>
      </div>
    </div>

    <div id="board" class="board">
      <canvas id="canvas" width="600" height="600" aria-label="Snake game board"></canvas>

      <div id="overlay" class="overlay">
        <div>
          <h2 id="message">Ready to play?</h2>
          <p id="detail">Collect food and avoid the walls.</p>
          <button id="start">Play</button>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys / WASD to move · Swipe on mobile · Space to pause</p>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const board = document.getElementById("board");
    const overlay = document.getElementById("overlay");
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");
    const startButton = document.getElementById("start");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");

    const size = 20;
    const cell = canvas.width / size;
    const speed = 130;

    let snake, direction, nextDirection, food, score;
    let running = false;
    let paused = false;
    let lastMove = 0;
    let turnQueued = false;
    let best = Number(localStorage.getItem("snakeBest")) || 0;
    bestEl.textContent = best;

    function randomFood() {
      const empty = [];

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (!snake.some(part => part.x === x && part.y === y)) {
            empty.push({ x, y });
          }
        }
      }

      return empty.length
        ? empty[Math.floor(Math.random() * empty.length)]
        : null;
    }

    function reset() {
      snake = [
        { x: 8, y: 10 },
        { x: 7, y: 10 },
        { x: 6, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      food = randomFood();
      score = 0;
      scoreEl.textContent = score;
      turnQueued = false;
      paused = false;
      lastMove = 0;
    }

    function start() {
      reset();
      running = true;
      overlay.hidden = true;
      draw();
    }

    function finish(won = false) {
      running = false;
      message.textContent = won ? "You win!" : "Game over";
      detail.textContent = `Your score: ${score}`;
      startButton.textContent = "Play again";
      overlay.hidden = false;
    }

    function move() {
      direction = nextDirection;
      turnQueued = false;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const eating = food && head.x === food.x && head.y === food.y;

      // Moving into the tail's old position is safe if it moves away.
      const body = eating ? snake : snake.slice(0, -1);
      const hitBody = body.some(part => part.x === head.x && part.y === head.y);
      const hitWall = head.x < 0 || head.y < 0 || head.x >= size || head.y >= size;

      if (hitWall || hitBody) {
        finish();
        return;
      }

      snake.unshift(head);

      if (eating) {
        score++;
        scoreEl.textContent = score;

        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem("snakeBest", best);
        }

        food = randomFood();
        if (!food) finish(true);
      } else {
        snake.pop();
      }
    }

    function roundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.roundRect(x, y, width, height, radius);
      ctx.fill();
    }

    function draw() {
      // Subtle checkerboard.
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          ctx.fillStyle = (x + y) % 2 ? "#1b1b1b" : "#202020";
          ctx.fillRect(x * cell, y * cell, cell, cell);
        }
      }

      if (food) {
        ctx.fillStyle = "#f36a6a";
        ctx.beginPath();
        ctx.arc(
          food.x * cell + cell / 2,
          food.y * cell + cell / 2,
          cell * .32,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#a8ecb2" : "#72c981";
        roundedRect(
          part.x * cell + 2,
          part.y * cell + 2,
          cell - 4,
          cell - 4,
          7
        );
      });
    }

    function loop(timestamp) {
      if (running && !paused) {
        if (!lastMove) lastMove = timestamp;
        if (timestamp - lastMove >= speed) {
          move();
          lastMove = timestamp;
          draw();
        }
      }
      requestAnimationFrame(loop);
    }

    function changeDirection(x, y) {
      if (!running || paused || turnQueued) return;
      if (x === -direction.x && y === -direction.y) return;
      nextDirection = { x, y };
      turnQueued = true;
    }

    document.addEventListener("keydown", event => {
      const key = event.key.toLowerCase();
      const controls = {
        arrowup: [0, -1], w: [0, -1],
        arrowdown: [0, 1], s: [0, 1],
        arrowleft: [-1, 0], a: [-1, 0],
        arrowright: [1, 0], d: [1, 0]
      };

      if (controls[key]) {
        event.preventDefault();
        changeDirection(...controls[key]);
      } else if (event.code === "Space" && running) {
        event.preventDefault();
        paused = !paused;
        lastMove = 0;
        message.textContent = "Paused";
        detail.textContent = "Press space or resume to continue.";
        startButton.textContent = "Resume";
        overlay.hidden = !paused;
      }
    });

    startButton.addEventListener("click", () => {
      if (running && paused) {
        paused = false;
        lastMove = 0;
        overlay.hidden = true;
      } else {
        start();
      }
    });

    let touchStart = null;

    board.addEventListener("touchstart", event => {
      const touch = event.touches[0];
      touchStart = { x: touch.clientX, y: touch.clientY };
    }, { passive: true });

    board.addEventListener("touchend", event => {
      if (!touchStart) return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;

      if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        changeDirection(dx > 0 ? 1 : -1, 0);
      } else {
        changeDirection(0, dy > 0 ? 1 : -1);
      }
    }, { passive: true });

    reset();
    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
