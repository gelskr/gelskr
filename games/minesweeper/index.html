<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; padding: 20px;
      background: #101010; color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    .game { width: min(100%, 450px); animation: enter .5s ease both; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.05em; }
    p { margin: 5px 0 0; color: #888; font-size: 13px; }
    .counter { color: #999; text-align: right; font-size: 12px; }
    .counter strong { display: block; color: white; font-size: 24px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 12px; }
    button {
      border: 1px solid #383838; border-radius: 9px; background: #222;
      color: white; padding: 9px 13px; font: inherit; cursor: pointer;
      transition: background .2s, transform .2s;
    }
    button:hover { background: #333; }
    button:active { transform: scale(.95); }
    button.active { border-color: #aaa; background: #444; }
    #status { margin-left: auto; align-self: center; color: #aaa; font-size: 13px; }
    .board {
      display: grid; grid-template-columns: repeat(9, 1fr);
      gap: 4px; padding: 7px; border: 1px solid #333;
      border-radius: 12px; background: #191919;
    }
    .cell {
      aspect-ratio: 1; padding: 0; border: 1px solid #3a3a3a;
      border-radius: 5px; background: #303030;
      font-size: clamp(14px, 4vw, 19px); font-weight: 700;
      display: grid; place-items: center;
      transition: background .15s, transform .15s;
    }
    .cell:hover { background: #454545; }
    .cell.revealed { background: #202020; border-color: #252525; cursor: default; }
    .cell.mine { background: #823f3f; }
    .n1 { color: #91b9f0; } .n2 { color: #91d49d; }
    .n3 { color: #ec9999; } .n4, .n5, .n6, .n7, .n8 { color: #d3b5ef; }
    .hint { text-align: center; margin-top: 14px; line-height: 1.5; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="game">
    <header>
      <div><h1>Minesweeper</h1><p>Find every safe tile.</p></div>
      <div class="counter">MINES LEFT<strong id="remaining">10</strong></div>
    </header>

    <div class="bar">
      <button id="reset">New game</button>
      <button id="flagMode" aria-pressed="false">Flag mode: off</button>
      <span id="status" aria-live="polite"></span>
    </div>

    <div id="board" class="board" aria-label="Minesweeper board"></div>
    <p class="hint">Click to reveal · Right-click to flag<br>On mobile, turn on flag mode to place flags.</p>
  </div>

  <script>
    const SIZE = 9, MINES = 10;
    const boardEl = document.getElementById("board");
    const remainingEl = document.getElementById("remaining");
    const statusEl = document.getElementById("status");
    const flagButton = document.getElementById("flagMode");

    let grid, firstMove, finished, flagMode;

    function reset() {
      grid = Array.from({ length: SIZE }, () =>
        Array.from({ length: SIZE }, () => ({
          mine: false, revealed: false, flagged: false, count: 0
        }))
      );
      firstMove = true;
      finished = false;
      flagMode = false;
      flagButton.classList.remove("active");
      flagButton.setAttribute("aria-pressed", "false");
      flagButton.textContent = "Flag mode: off";
      statusEl.textContent = "";
      render();
    }

    function neighbors(r, c) {
      const result = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if ((dr || dc) && nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
            result.push([nr, nc]);
          }
        }
      }
      return result;
    }

    function placeMines(safeR, safeC) {
      const positions = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (r !== safeR || c !== safeC) positions.push([r, c]);
        }
      }

      // Partial Fisher–Yates shuffle.
      for (let i = 0; i < MINES; i++) {
        const j = i + Math.floor(Math.random() * (positions.length - i));
        [positions[i], positions[j]] = [positions[j], positions[i]];
        const [r, c] = positions[i];
        grid[r][c].mine = true;
      }

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          grid[r][c].count = neighbors(r, c)
            .filter(([nr, nc]) => grid[nr][nc].mine).length;
        }
      }
    }

    function reveal(r, c) {
      const cell = grid[r][c];
      if (finished || cell.revealed || cell.flagged) return;

      if (firstMove) {
        placeMines(r, c);
        firstMove = false;
      }

      if (cell.mine) {
        cell.revealed = true;
        finished = true;
        statusEl.textContent = "Game over";
        grid.flat().forEach(item => {
          if (item.mine) item.revealed = true;
        });
      } else {
        // Reveal connected empty tiles and their numbered edges.
        const stack = [[r, c]];
        while (stack.length) {
          const [cr, cc] = stack.pop();
          const current = grid[cr][cc];
          if (current.revealed || current.flagged || current.mine) continue;
          current.revealed = true;
          if (current.count === 0) stack.push(...neighbors(cr, cc));
        }

        const revealed = grid.flat().filter(item => item.revealed).length;
        if (revealed === SIZE * SIZE - MINES) {
          finished = true;
          statusEl.textContent = "You win!";
        }
      }
      render();
    }

    function toggleFlag(r, c) {
      const cell = grid[r][c];
      if (finished || cell.revealed) return;
      cell.flagged = !cell.flagged;
      render();
    }

    function render() {
      boardEl.replaceChildren();
      const flags = grid.flat().filter(cell => cell.flagged).length;
      remainingEl.textContent = MINES - flags;

      grid.forEach((row, r) => row.forEach((cell, c) => {
        const button = document.createElement("button");
        button.className = "cell";

        if (cell.revealed) {
          button.classList.add("revealed");
          if (cell.mine) {
            button.classList.add("mine");
            button.textContent = "✹";
          } else if (cell.count) {
            button.textContent = cell.count;
            button.classList.add(`n${cell.count}`);
          }
        } else if (cell.flagged) {
          button.textContent = "⚑";
        }

        button.setAttribute("aria-label",
          `Row ${r + 1}, column ${c + 1}: ` +
          (cell.revealed ? (cell.mine ? "mine" : `${cell.count} nearby mines`)
                         : cell.flagged ? "flagged" : "hidden"));

        button.addEventListener("click", () => {
          if (flagMode) toggleFlag(r, c);
          else reveal(r, c);
        });

        button.addEventListener("contextmenu", event => {
          event.preventDefault();
          toggleFlag(r, c);
        });

        boardEl.appendChild(button);
      }));
    }

    flagButton.addEventListener("click", () => {
      flagMode = !flagMode;
      flagButton.classList.toggle("active", flagMode);
      flagButton.setAttribute("aria-pressed", String(flagMode));
      flagButton.textContent = `Flag mode: ${flagMode ? "on" : "off"}`;
    });

    document.getElementById("reset").addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
