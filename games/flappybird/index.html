<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flappy Bird</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    touch-action: manipulation;
  }

  canvas {
    display: block;
    height: min(100dvh, 900px);
    width: min(100vw, calc(100dvh * 0.5625), 506.25px);
    max-height: 100dvh;
    image-rendering: pixelated;
    cursor: pointer;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="360" height="640" aria-label="Flappy Bird game"></canvas>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width;
  const H = canvas.height;
  const GROUND = 560;
  const PIPE_WIDTH = 62;
  const PIPE_GAP = 155;
  const PIPE_SPEED = 2.15;
  const GRAVITY = 0.39;
  const FLAP = -6.6;

  let state = "ready";
  let bird, pipes, score, frame, groundOffset, lastTime, accumulator;
  let best = 0;
  let audio;

  try { best = Number(localStorage.getItem("flappy-best")) || 0; } catch (_) {}

  function reset() {
    bird = { x: 85, y: 265, velocity: 0, rotation: 0 };
    pipes = [];
    score = 0;
    frame = 0;
    groundOffset = 0;
    accumulator = 0;
    state = "ready";
  }

  // Synthesized sounds: no external files required.
  function sound(type) {
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();

      const now = audio.currentTime;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.connect(gain);
      gain.connect(audio.destination);

      const settings = {
        flap:  { from: 600, to: 320, duration: 0.10, volume: 0.09, wave: "triangle" },
        point: { from: 620, to: 940, duration: 0.16, volume: 0.10, wave: "sine" },
        hit:   { from: 180, to: 55,  duration: 0.25, volume: 0.12, wave: "sawtooth" }
      }[type];

      oscillator.type = settings.wave;
      oscillator.frequency.setValueAtTime(settings.from, now);
      oscillator.frequency.exponentialRampToValueAtTime(settings.to, now + settings.duration);
      gain.gain.setValueAtTime(settings.volume, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + settings.duration);
      oscillator.start(now);
      oscillator.stop(now + settings.duration);
    } catch (_) {}
  }

  function act() {
    if (state === "dead") {
      reset();
      return;
    }
    if (state === "ready") state = "playing";
    bird.velocity = FLAP;
    sound("flap");
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    act();
  });

  window.addEventListener("keydown", e => {
    if ((e.code === "Space" || e.code === "ArrowUp") && !e.repeat) {
      e.preventDefault();
      act();
    }
  });

  function die() {
    if (state !== "playing") return;
    state = "dead";
    sound("hit");
    if (score > best) {
      best = score;
      try { localStorage.setItem("flappy-best", best); } catch (_) {}
    }
  }

  function update() {
    frame++;
    if (state !== "dead") groundOffset = (groundOffset + PIPE_SPEED) % 24;

    if (state === "ready") {
      bird.y = 265 + Math.sin(frame / 12) * 7;
      return;
    }
    if (state === "dead") return;

    bird.velocity += GRAVITY;
    bird.y += bird.velocity;
    bird.rotation = Math.max(-0.45, Math.min(1.2, bird.velocity * 0.08));

    if (frame % 95 === 0) {
      const top = 100 + Math.random() * 210;
      pipes.push({ x: W + 10, top, scored: false });
    }

    for (const pipe of pipes) {
      pipe.x -= PIPE_SPEED;

      if (!pipe.scored && pipe.x + PIPE_WIDTH < bird.x) {
        pipe.scored = true;
        score++;
        sound("point");
      }

      const left = bird.x - 12;
      const right = bird.x + 12;
      const top = bird.y - 11;
      const bottom = bird.y + 11;

      if (right > pipe.x && left < pipe.x + PIPE_WIDTH &&
          (top < pipe.top || bottom > pipe.top + PIPE_GAP)) die();
    }

    pipes = pipes.filter(pipe => pipe.x + PIPE_WIDTH > -10);
    if (bird.y - 11 < 0 || bird.y + 11 >= GROUND) die();
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function outlinedText(text, x, y, size, fill = "#fff", align = "center") {
    ctx.font = `900 ${size}px Arial, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = 5;
    ctx.strokeStyle = "#51342b";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(text, x, y);
  }

  function drawBackground() {
    rect(0, 0, W, H, "#70c5ce");

    // Distant clouds.
    ctx.fillStyle = "#d7f0df";
    for (let i = 0; i < 5; i++) {
      const x = i * 90 - 20;
      ctx.beginPath();
      ctx.arc(x + 15, 425, 18, Math.PI, 0);
      ctx.arc(x + 38, 420, 24, Math.PI, 0);
      ctx.arc(x + 62, 428, 16, Math.PI, 0);
      ctx.fill();
    }

    // Soft city silhouette.
    rect(0, 470, W, 90, "#b7dca5");
    for (let i = 0; i < 15; i++) {
      const x = i * 27;
      const h = 22 + ((i * 19) % 33);
      rect(x, 470 - h, 20, h, "#b7dca5");
      rect(x + 5, 470 - h - 5, 10, 5, "#b7dca5");
    }

    // Bushes.
    ctx.fillStyle = "#7fbd75";
    for (let i = 0; i < 15; i++) {
      ctx.beginPath();
      ctx.arc(i * 28, 530, 22, Math.PI, 0);
      ctx.fill();
    }
    rect(0, 530, W, 30, "#7fbd75");
  }

  function drawPipe(x, top, bottomPipe) {
    const capH = 25;
    const bodyTop = bottomPipe ? top : 0;
    const bodyBottom = bottomPipe ? GROUND : top;
    const bodyH = bodyBottom - bodyTop;

    rect(x + 5, bodyTop, PIPE_WIDTH - 10, bodyH, "#3c5429");
    rect(x + 9, bodyTop, PIPE_WIDTH - 18, bodyH, "#74bf39");
    rect(x + 13, bodyTop, 8, bodyH, "#a4e45e");
    rect(x + PIPE_WIDTH - 16, bodyTop, 6, bodyH, "#4a9d32");

    const capY = bottomPipe ? top : top - capH;
    rect(x, capY, PIPE_WIDTH, capH, "#364f28");
    rect(x + 3, capY + 3, PIPE_WIDTH - 6, capH - 6, "#75c43d");
    rect(x + 7, capY + 4, 8, capH - 8, "#a8e765");
    rect(x + PIPE_WIDTH - 12, capY + 4, 6, capH - 8, "#4c9d32");
  }

  function drawGround() {
    rect(0, GROUND, W, 80, "#ded895");
    rect(0, GROUND, W, 5, "#4b6a2e");
    rect(0, GROUND + 5, W, 8, "#a2d451");
    rect(0, GROUND + 13, W, 3, "#638b35");

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, GROUND + 5, W, 8);
    ctx.clip();
    for (let x = -24 - groundOffset; x < W + 24; x += 24) {
      ctx.fillStyle = "#d1ed71";
      ctx.beginPath();
      ctx.moveTo(x, GROUND + 13);
      ctx.lineTo(x + 8, GROUND + 5);
      ctx.lineTo(x + 16, GROUND + 5);
      ctx.lineTo(x + 8, GROUND + 13);
      ctx.fill();
    }
    ctx.restore();
    rect(0, GROUND + 17, W, 2, "#c5ba72");
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Chunky pixel-art silhouette.
    rect(-15, -10, 27, 21, "#553b29");
    rect(-18, -6, 33, 14, "#553b29");
    rect(-13, -13, 20, 26, "#553b29");
    rect(-13, -9, 24, 18, "#f5d43b");
    rect(-10, -12, 16, 23, "#f5d43b");
    rect(-12, 4, 20, 5, "#e8a92e");

    // Wing.
    const wingY = state === "playing" && frame % 12 < 6 ? -1 : 3;
    rect(-16, wingY, 15, 8, "#966b32");
    rect(-14, wingY, 11, 5, "#fff0a5");

    // Eye and beak.
    rect(3, -11, 10, 12, "#553b29");
    rect(4, -10, 8, 10, "#fff");
    rect(9, -7, 3, 5, "#222");
    rect(7, 1, 13, 7, "#8b4328");
    rect(8, 2, 11, 4, "#f28b36");
    ctx.restore();
  }

  function draw() {
    drawBackground();
    for (const pipe of pipes) {
      drawPipe(pipe.x, pipe.top, false);
      drawPipe(pipe.x, pipe.top + PIPE_GAP, true);
    }
    drawGround();
    drawBird();

    if (state === "ready") {
      outlinedText("FLAPPY BIRD", W / 2, 150, 34, "#ffe45b");
      outlinedText("Get Ready!", W / 2, 205, 25);
      outlinedText("Tap or press Space", W / 2, 355, 19);
      outlinedText("to flap", W / 2, 380, 19);
    } else if (state === "playing") {
      outlinedText(String(score), W / 2, 65, 42);
    } else {
      outlinedText("Game Over", W / 2, 165, 36, "#ffdf69");
      rect(61, 210, 238, 135, "#684d36");
      rect(66, 215, 228, 125, "#e9d8a0");
      rect(71, 220, 218, 115, "#f4e6b5");
      outlinedText("SCORE", 110, 250, 18, "#e88a43");
      outlinedText(String(score), 245, 250, 26);
      outlinedText("BEST", 110, 300, 18, "#e88a43");
      outlinedText(String(best), 245, 300, 26);
      outlinedText("Tap to restart", W / 2, 405, 22);
    }
  }

  function loop(time) {
    if (lastTime === undefined) lastTime = time;
    accumulator += Math.min(time - lastTime, 100);
    lastTime = time;
    while (accumulator >= 1000 / 60) {
      update();
      accumulator -= 1000 / 60;
    }
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
