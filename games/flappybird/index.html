<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center; padding: 20px;
      background: #101010; color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    .game { width: min(100%, 380px); animation: enter .5s ease both; }
    header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.05em; }
    p { margin: 5px 0 0; color: #888; font-size: 13px; }
    .score { color: #aaa; text-align: right; font-size: 12px; }
    .score strong { display: block; color: white; font-size: 24px; }
    .board {
      position: relative; overflow: hidden; border: 1px solid #333;
      border-radius: 16px; touch-action: manipulation;
    }
    canvas { display: block; width: 100%; height: auto; }
    .overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      text-align: center; background: rgba(0,0,0,.65);
      backdrop-filter: blur(4px); animation: fade .2s ease;
    }
    h2 { margin: 0 0 8px; font-size: 27px; }
    .overlay p { margin: 0 0 18px; color: #bbb; }
    button {
      padding: 10px 22px; border: 0; border-radius: 9px;
      background: #f5f5f5; color: #111; font: inherit;
      font-weight: 700; cursor: pointer; transition: transform .2s;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: scale(.96); }
    .hint { text-align: center; margin-top: 14px; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="game">
    <header>
      <div><h1>Flappy Bird</h1><p>Fly through the gaps.</p></div>
      <div class="score">SCORE<strong id="score">0</strong></div>
    </header>

    <div class="board" id="board">
      <canvas id="canvas" width="380" height="520" aria-label="Flappy Bird game"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <h2 id="message">Ready?</h2>
          <p id="detail">Tap or press space to flap.</p>
          <button id="start">Play</button>
        </div>
      </div>
    </div>
    <p class="hint">Click / tap / space to flap</p>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const board = document.getElementById("board");
    const overlay = document.getElementById("overlay");
    const scoreEl = document.getElementById("score");
    const message = document.getElementById("message");
    const detail = document.getElementById("detail");
    const startButton = document.getElementById("start");

    const W = canvas.width, H = canvas.height;
    const ground = 35, birdX = 90, radius = 14;
    const pipeWidth = 56, gap = 145;
    let birdY = H / 2, velocity = 0, pipes = [], score = 0;
    let running = false, lastTime = 0, spawnTimer = 0;

    function reset() {
      birdY = H / 2;
      velocity = 0;
      pipes = [];
      score = 0;
      spawnTimer = 0;
      lastTime = 0;
      scoreEl.textContent = 0;
    }

    function start() {
      reset();
      running = true;
      overlay.hidden = true;
    }

    function flap() {
      if (running) velocity = -310;
    }

    function end() {
      running = false;
      message.textContent = "Game over";
      detail.textContent = `You scored ${score}.`;
      startButton.textContent = "Play again";
      overlay.hidden = false;
    }

    function update(dt) {
      velocity += 850 * dt;
      birdY += velocity * dt;
      spawnTimer += dt;

      if (spawnTimer >= 1.55) {
        spawnTimer = 0;
        const top = 60 + Math.random() * (H - ground - gap - 120);
        pipes.push({ x: W, top, scored: false });
      }

      for (const pipe of pipes) {
        pipe.x -= 145 * dt;

        if (!pipe.scored && pipe.x + pipeWidth < birdX) {
          pipe.scored = true;
          score++;
          scoreEl.textContent = score;
        }

        const overlapsX = birdX + radius > pipe.x && birdX - radius < pipe.x + pipeWidth;
        const overlapsPipe = birdY - radius < pipe.top || birdY + radius > pipe.top + gap;
        if (overlapsX && overlapsPipe) {
          end();
          return;
        }
      }

      pipes = pipes.filter(pipe => pipe.x + pipeWidth > 0);

      if (birdY - radius < 0 || birdY + radius > H - ground) end();
    }

    function draw() {
      ctx.fillStyle = "#1b1d20";
      ctx.fillRect(0, 0, W, H);

      // Background stars.
      ctx.fillStyle = "#303338";
      for (let i = 0; i < 22; i++) {
        ctx.beginPath();
        ctx.arc((i * 97 + 25) % W, (i * 67 + 30) % (H - ground), 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const pipe of pipes) {
        ctx.fillStyle = "#79b887";
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.top);
        ctx.fillRect(pipe.x, pipe.top + gap, pipeWidth, H - ground - pipe.top - gap);
        ctx.fillStyle = "#a1d0aa";
        ctx.fillRect(pipe.x - 3, pipe.top - 12, pipeWidth + 6, 12);
        ctx.fillRect(pipe.x - 3, pipe.top + gap, pipeWidth + 6, 12);
      }

      ctx.fillStyle = "#343434";
      ctx.fillRect(0, H - ground, W, ground);
      ctx.fillStyle = "#555";
      ctx.fillRect(0, H - ground, W, 3);

      ctx.fillStyle = "#f2cc72";
      ctx.beginPath();
      ctx.arc(birdX, birdY, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#202020";
      ctx.beginPath();
      ctx.arc(birdX + 5, birdY - 4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e58b59";
      ctx.beginPath();
      ctx.moveTo(birdX + 12, birdY);
      ctx.lineTo(birdX + 21, birdY + 3);
      ctx.lineTo(birdX + 12, birdY + 6);
      ctx.fill();
    }

    function loop(time) {
      if (running) {
        if (!lastTime) lastTime = time;
        const dt = Math.min((time - lastTime) / 1000, 0.04);
        lastTime = time;
        update(dt);
      }
      draw();
      requestAnimationFrame(loop);
    }

    startButton.addEventListener("click", event => {
      event.stopPropagation();
      start();
    });

    board.addEventListener("pointerdown", event => {
      if (running) {
        event.preventDefault();
        flap();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.code === "Space" || event.code === "ArrowUp") {
        event.preventDefault();
        if (running) flap();
      }
    });

    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
