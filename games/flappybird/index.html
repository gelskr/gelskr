<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    canvas {
      background: #70c5ce;
      max-width: 100vw;
      max-height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="game" width="288" height="512"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Constants
const GROUND_H = 112;
const GRAVITY = 0.25;
const FLAP = -4.6;
const PIPE_SPEED = 2;
const PIPE_GAP = 100;
const PIPE_W = 52;
const PIPE_INTERVAL = 90;   // frames between pipes
const BIRD_W = 34;
const BIRD_H = 24;

let state, bird, pipes, score, best = 0, frame, groundOffset;

function reset() {
  bird = { x: 60, y: H / 2 - 60, vy: 0, rot: 0, wingT: 0, landed: false };
  pipes = [];
  score = 0;
  frame = 0;
  groundOffset = 0;
  state = 'ready';
}

function flap() {
  if (state === 'ready') {
    state = 'playing';
    bird.vy = FLAP;
  } else if (state === 'playing') {
    bird.vy = FLAP;
  } else if (state === 'dead' && bird.landed) {
    reset();
  }
}

function die() {
  state = 'dead';
  bird.landed = false;
  best = Math.max(best, score);
}

function hitPipe() {
  const bx = bird.x + 4, by = bird.y + 4;
  const bw = BIRD_W - 8, bh = BIRD_H - 8;
  for (const p of pipes) {
    if (bx + bw > p.x && bx < p.x + PIPE_W) {
      if (by < p.top || by + bh > p.top + PIPE_GAP) return true;
    }
  }
  return false;
}

function update() {
  if (state === 'ready') {
    bird.y = H / 2 - 60 + Math.sin(frame * 0.08) * 6;
    bird.wingT += 0.3;
    groundOffset = (groundOffset + 1) % 24;
    frame++;
  } else if (state === 'playing') {
    frame++;
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.wingT += 0.3;
    bird.rot = bird.vy < 0 ? -0.35 : Math.min(bird.rot + 0.05, 1.3);

    if (frame % PIPE_INTERVAL === 0) {
      const minTop = 50;
      const maxTop = H - GROUND_H - PIPE_GAP - 50;
      pipes.push({ x: W, top: minTop + Math.random() * (maxTop - minTop), passed: false });
    }

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) {
        p.passed = true;
        score++;
      }
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -10);
    groundOffset = (groundOffset + PIPE_SPEED) % 24;

    if (bird.y < 0) { bird.y = 0; bird.vy = 0; }
    if (hitPipe() || bird.y + BIRD_H >= H - GROUND_H) die();
  } else if (state === 'dead') {
    bird.vy += GRAVITY;
    bird.y += bird.vy;
    bird.rot = Math.min(bird.rot + 0.1, Math.PI / 2);
    const floor = H - GROUND_H - BIRD_H;
    if (bird.y >= floor) {
      bird.y = floor;
      bird.vy = 0;
      bird.landed = true;
    }
  }
}

// Drawing helpers
function drawPipeBox(x, y, w, h) {
  ctx.fillStyle = '#73bf2e';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#9be05a';
  ctx.fillRect(x + 4, y, 6, h);
  ctx.fillStyle = '#558c22';
  ctx.fillRect(x, y, 2, h);
  ctx.fillRect(x + w - 2, y, 2, h);
}

function drawPipe(p) {
  const capH = 24;
  const bottomY = p.top + PIPE_GAP;
  // Top pipe
  drawPipeBox(p.x + 3, 0, PIPE_W - 6, p.top - capH);
  drawPipeBox(p.x - 3, p.top - capH, PIPE_W + 6, capH);
  // Bottom pipe
  drawPipeBox(p.x - 3, bottomY, PIPE_W + 6, capH);
  drawPipeBox(p.x + 3, bottomY + capH, PIPE_W - 6, H - GROUND_H - bottomY - capH);
}

function drawGround() {
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#73bf2e';
  ctx.fillRect(0, H - GROUND_H, W, 14);
  ctx.fillStyle = '#558c22';
  ctx.fillRect(0, H - GROUND_H + 14, W, 4);
  ctx.fillStyle = '#c9bb6a';
  for (let x = -groundOffset; x < W; x += 24) {
    ctx.fillRect(x, H - GROUND_H + 30, 12, 4);
    ctx.fillRect(x + 12, H - GROUND_H + 60, 12, 4);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x + BIRD_W / 2, bird.y + BIRD_H / 2);
  ctx.rotate(bird.rot);

  // Body
  ctx.fillStyle = '#f8e71c';
  ctx.strokeStyle = '#5a3a0a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 17, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Wing (animated)
  const wingUp = Math.sin(bird.wingT) > 0;
  ctx.fillStyle = '#e0c916';
  ctx.beginPath();
  ctx.ellipse(-4, wingUp ? -2 : 3, 8, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(6, -4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#f57f17';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(20, 3);
  ctx.lineTo(10, 6);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

function drawText(text, x, y, size) {
  ctx.font = `bold ${size}px Arial`;
  ctx.textAlign = 'center';
  ctx.lineWidth = Math.max(4, size / 6);
  ctx.strokeStyle = '#543847';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#fff';
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.fillStyle = '#70c5ce';
  ctx.fillRect(0, 0, W, H);

  pipes.forEach(drawPipe);
  drawGround();
  drawBird();

  if (state === 'playing' || state === 'dead') {
    drawText(score, W / 2, 80, 40);
  }

  if (state === 'ready') {
    drawText('Flappy Bird', W / 2, 140, 36);
    ctx.font = '16px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#543847';
    ctx.lineWidth = 4;
    ctx.strokeText('Tap or press Space', W / 2, 200);
    ctx.fillText('Tap or press Space', W / 2, 200);
  }

  if (state === 'dead' && bird.landed) {
    drawText('Game Over', W / 2, 200, 34);
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#543847';
    ctx.lineWidth = 4;
    const info = `Score: ${score}   Best: ${best}`;
    ctx.strokeText(info, W / 2, 240);
    ctx.fillText(info, W / 2, 240);
    ctx.strokeText('Tap to restart', W / 2, 275);
    ctx.fillText('Tap to restart', W / 2, 275);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Input
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  flap();
}, { passive: false });

reset();
loop();
</script>
</body>
</html>
