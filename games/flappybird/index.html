<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #171717;
  font-family: monospace;
  overflow: hidden;
}

canvas {
  height: 100vh;
  height: 100dvh;
  width: auto;
  max-width: 100vw;
  object-fit: contain;
  image-rendering: pixelated;
  touch-action: manipulation;
  cursor: pointer;
}
</style>
</head>

<body>

<canvas id="game" width="378" height="672"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;
const GROUND = 652;
const PIPE_W = 72;
const GAP = 136;

// GAME SETTINGS
const PIPE_SPEED = 3.0;
const PIPE_SPACING = 270;
const GRAVITY = 0.28;
const FLAP_POWER = -5.2;
const MAX_FALL_SPEED = 6;

let bird, pipes, score, state, frame;

function reset() {
  bird = {
    x: 100,
    y: 320,
    velocity: 0,
    angle: 0
  };

  pipes = [
    { x: 330, gapY: 325, passed: false },
    { x: 600, gapY: 345, passed: false }
  ];

  score = 0;
  frame = 0;
  state = "ready";
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;

  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    w,
    h
  );
}

function background() {
  ctx.save();

  ctx.scale(1, H / 273);

  rect(0, 0, W, 273, "#4ec0c8");

  // Blocky cream clouds.
  ctx.fillStyle = "#edf8d3";
  ctx.beginPath();
  ctx.moveTo(0, 160);

  [
    [10,162], [10,168], [20,168], [20,177],
    [27,177], [27,193], [47,193], [47,189],
    [83,189], [83,198], [96,198], [96,188],
    [106,188], [106,177], [119,177], [119,166],
    [160,166], [160,171], [170,171], [170,178],
    [180,178], [180,185], [188,185], [188,189],
    [198,189], [198,179], [207,179], [207,173],
    [220,173], [220,169], [249,169], [249,174],
    [259,174], [259,167], [273,167], [273,161],
    [282,161], [282,156], [307,156], [307,160],
    [326,160], [326,166], [343,166], [343,174],
    [351,174], [351,165], [364,165], [364,157],
    [372,157], [372,152], [378,152],
    [378,273], [0,273]
  ].forEach(([x, y]) => ctx.lineTo(x, y));

  ctx.closePath();
  ctx.fill();

  // Distant pixel city.
  building(25,235,36,38,0);
  building(66,224,42,49,1);
  building(105,240,41,33,0);
  building(184,250,28,23,0);
  building(260,224,21,49,1);
  building(278,240,41,33,0);
  building(357,251,25,22,0);

  // Ground.
  rect(0,253,W,20,"#ded895");
  rect(0,253,W,4,"#507b45");
  rect(0,257,W,4,"#a9db6b");

  for (let x = 0; x < W; x += 16) {
    rect(x,262,8,3,"#c0b875");
  }

  ctx.restore();
}

function building(x, y, w, h, tower) {
  const outline = "#86c9bb";

  rect(x,y,w,h,outline);
  rect(x+4,y+4,w-8,h-4,"#dcf2ce");

  if (tower) {
    rect(x+18,y-7,w-18,7,outline);
    rect(x+22,y-3,w-26,4,"#dcf2ce");
  }

  for (let wx = x+9; wx < x+w-5; wx += 12) {
    for (let wy = y+10; wy < 249; wy += 14) {
      rect(wx,wy,5,8,"#bee7c8");
    }
  }
}

function pipe(x, y, height, upsideDown) {
  if (height <= 0) return;

  const capH = 36;

  const capY = upsideDown
    ? y + height - capH
    : y;

  const shaftX = x + 4;
  const shaftW = PIPE_W - 8;

  // Dark pixel outline and shaded shaft.
  rect(shaftX-3,y,shaftW+6,height,"#543a42");
  rect(shaftX,y,shaftW,height,"#40df34");
  rect(shaftX+8,y,7,height,"#a1ff82");
  rect(shaftX+16,y,7,height,"#efffe5");
  rect(shaftX+24,y,6,height,"#63f04b");
  rect(shaftX+47,y,6,height,"#2fc626");
  rect(shaftX+57,y,5,height,"#26a829");

  // Pipe lip.
  rect(x-3,capY,PIPE_W+6,capH,"#543a42");
  rect(x,capY+4,PIPE_W,capH-8,"#37d52d");
  rect(x+5,capY+4,7,capH-8,"#8bff76");
  rect(x+13,capY+4,7,capH-8,"#efffe5");
  rect(x+21,capY+4,6,capH-8,"#64f34f");
  rect(x+50,capY+4,5,capH-8,"#27c329");
  rect(x+62,capY+4,5,capH-8,"#25ae28");
}

function drawBird() {
  ctx.save();

  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.angle);
  ctx.translate(-bird.x,-bird.y);

  const x = Math.round(bird.x-17);
  const y = Math.round(bird.y-14);

  const wing = Math.floor(frame/8)%2;

  // Pixel silhouette.
  rect(x+10,y,19,3,"#29202a");
  rect(x+5,y+3,29,3,"#29202a");
  rect(x+2,y+6,35,15,"#29202a");
  rect(x+6,y+21,29,4,"#29202a");
  rect(x+12,y+25,17,3,"#29202a");

  // Yellow body.
  rect(x+8,y+6,21,16,"#f5bb37");
  rect(x+12,y+3,14,4,"#ffe278");
  rect(x+13,y+21,15,4,"#e4892c");

  // White eye.
  rect(x+22,y+3,9,3,"#29202a");
  rect(x+20,y+6,14,10,"#29202a");
  rect(x+23,y+5,8,10,"#fffdf0");
  rect(x+28,y+8,3,6,"#29202a");

  // White wing.
  const wy = wing ? 10 : 8;

  rect(x,y+wy,14,12,"#29202a");
  rect(x+3,y+wy-2,9,16,"#29202a");
  rect(x+3,y+wy+1,10,10,"#fffdf0");
  rect(x+6,y+wy-1,6,2,"#fffdf0");

  // Orange beak.
  rect(x+25,y+16,14,3,"#29202a");
  rect(x+22,y+19,19,6,"#29202a");
  rect(x+25,y+18,12,3,"#f27530");
  rect(x+25,y+22,12,2,"#e4512f");

  ctx.restore();
}

function label(text, y, size, color = "#fff") {
  ctx.font = `bold ${size}px monospace`;
  ctx.textAlign = "center";
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#543a42";

  ctx.strokeText(text,W/2,y);

  ctx.fillStyle = color;
  ctx.fillText(text,W/2,y);
}

// GAME UPDATE
function update() {
  if (state !== "playing") return;

  frame++;

  bird.velocity += GRAVITY;

  bird.velocity = Math.min(
    bird.velocity,
    MAX_FALL_SPEED
  );

  bird.y += bird.velocity;

  // Bird tilts up while flapping and down while falling.
  const targetAngle = Math.max(
    -0.4,
    Math.min(0.7,bird.velocity*0.12)
  );

  bird.angle += (targetAngle-bird.angle)*0.12;

  for (const p of pipes) {
    // Faster pipes.
    p.x -= PIPE_SPEED;

    // Score when passing a pipe.
    if (!p.passed && p.x+PIPE_W < bird.x) {
      p.passed = true;
      score++;

      playSound("score");
    }

    // Collision detection.
    const overlapsX =
      bird.x+13 > p.x &&
      bird.x-13 < p.x+PIPE_W;

    if (
      overlapsX &&
      (
        bird.y-10 < p.gapY-GAP/2 ||
        bird.y+10 > p.gapY+GAP/2
      )
    ) {
      if (state !== "over") {
        playSound("hit");
      }

      state = "over";
    }
  }

  // Create new pipes farther apart.
  if (pipes[0].x+PIPE_W < 0) {
    pipes.shift();

    const previous = pipes[pipes.length-1];

    pipes.push({
      x: previous.x+PIPE_SPACING,
      gapY: 200+Math.random()*250,
      passed: false
    });
  }

  // Ground and ceiling collision.
  if (bird.y+13 >= GROUND || bird.y-13 < 0) {
    bird.y = Math.max(
      13,
      Math.min(GROUND-13,bird.y)
    );

    if (state !== "over") {
      playSound("hit");
    }

    state = "over";
  }
}

// DRAW GAME
function draw() {
  background();

  for (const p of pipes) {
    const topHeight = p.gapY-GAP/2;
    const bottomY = p.gapY+GAP/2;

    pipe(p.x,0,topHeight,true);
    pipe(p.x,bottomY,GROUND-bottomY,false);
  }

  drawBird();

  label(String(score),35,24);

  if (state === "ready") {
    label("FLAPPY BIRD",92,22,"#ffe477");
    label("Click, tap, or SPACE",116,11);
  }

  if (state === "over") {
    label("GAME OVER",100,22,"#ffe477");
    label("Click or press SPACE to retry",120,10);
  }
}

// SOUND EFFECTS
let audioContext;

function playSound(type) {
  try {
    audioContext ??= new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const now = audioContext.currentTime;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    if (type === "flap") {
      oscillator.type = "triangle";

      oscillator.frequency.setValueAtTime(500,now);

      oscillator.frequency.exponentialRampToValueAtTime(
        300,
        now+0.1
      );

      gain.gain.setValueAtTime(0.12,now);

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now+0.1
      );

      oscillator.start(now);
      oscillator.stop(now+0.1);
    }

    else if (type === "score") {
      oscillator.type = "square";

      oscillator.frequency.setValueAtTime(660,now);
      oscillator.frequency.setValueAtTime(880,now+0.07);

      gain.gain.setValueAtTime(0.06,now);

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now+0.18
      );

      oscillator.start(now);
      oscillator.stop(now+0.18);
    }

    else if (type === "hit") {
      oscillator.type = "sawtooth";

      oscillator.frequency.setValueAtTime(180,now);

      oscillator.frequency.exponentialRampToValueAtTime(
        55,
        now+0.3
      );

      gain.gain.setValueAtTime(0.1,now);

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now+0.3
      );

      oscillator.start(now);
      oscillator.stop(now+0.3);
    }

  } catch (error) {
    // Game remains playable if audio is unavailable.
  }
}

// FLAP
function flap() {
  playSound("flap");

  if (state === "over") {
    reset();
  }

  state = "playing";
  bird.velocity = FLAP_POWER;
}

// MOUSE AND TOUCH CONTROLS
canvas.addEventListener("pointerdown", flap);

// KEYBOARD CONTROLS
window.addEventListener("keydown", event => {
  if (
    (
      event.code === "Space" ||
      event.code === "ArrowUp"
    ) &&
    !event.repeat
  ) {
    event.preventDefault();
    flap();
  }
});

// START GAME
reset();

let last = 0;
let accumulator = 0;

function loop(time) {
  accumulator += Math.min(time-last,100);
  last = time;

  while (accumulator >= 1000/60) {
    update();
    accumulator -= 1000/60;
  }

  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
