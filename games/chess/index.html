<!DOCTYPE html>


<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess vs AI</title>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>


  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --background: #080808;
      --panel: #2d2b29;
      --light-square: #eeeed2;
      --dark-square: #779556;
      --text: #f5f5f5;
      --muted: #b8b8b8;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    /* Setup screen */

    #setupScreen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .setup-card {
      width: min(100%, 420px);
      padding: 28px;
      border: 1px solid #292929;
      border-radius: 18px;
      background: #111;
    }

    .setup-card h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .setup-subtitle {
      margin: 8px 0 28px;
      color: var(--muted);
    }

    .setup-field {
      display: grid;
      gap: 9px;
      margin-bottom: 20px;
    }

    .setup-field label {
      font-size: 14px;
      font-weight: 600;
    }

    .setup-field select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #393939;
      border-radius: 9px;
      background: #1b1b1b;
      color: var(--text);
    }

    .play-button {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #779556;
      color: white;
      font-weight: 700;
      transition: background 150ms ease, transform 150ms ease;
    }

    .play-button:hover {
      background: #89a867;
    }

    .play-button:active {
      transform: scale(0.99);
    }

    /* Game screen */

    #gameScreen {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      overflow: hidden;
      padding: 0;
    }

    .player-bar {
      width: min(100%, 1160px);
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: var(--panel);
      flex-shrink: 0;
    }

    .player-bar.opponent {
      border-radius: 0;
    }

    .player-bar.player {
      border-radius: 0;
    }

    .player-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 4px;
      background: #44413e;
      color: #8e8a86;
      font-size: 28px;
      line-height: 1;
    }

    .player-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-name {
      font-size: 14px;
      font-weight: 700;
    }

    .player-detail {
      color: #c1bfbc;
      font-size: 12px;
    }

    #status {
      width: min(100%, 1160px);
      padding: 6px 12px;
      color: #d1d1d1;
      font-size: 13px;
      text-align: center;
      flex-shrink: 0;
    }

    #board {
      width: min(100vw, calc(100dvh - 112px));
      max-width: 1160px;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 2px;
      touch-action: manipulation;
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .square.light {
      background: var(--light-square);
    }

    .square.dark {
      background: var(--dark-square);
    }

    .square.selected {
      background: #baca44;
    }

    .square.last-move.light {
      background: #f5f682;
    }

    .square.last-move.dark {
      background: #baca44;
    }

    .square:focus-visible {
      outline: 3px solid #f5f5f5;
      outline-offset: -4px;
      z-index: 2;
    }

    .piece {
      position: relative;
      z-index: 1;
      display: block;
      font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif;
      font-size: clamp(24px, 8.2vw, 78px);
      line-height: 1;
      pointer-events: none;
    }

    .white-piece {
      color: #fff;
      -webkit-text-stroke: 1px #555;
      text-shadow: 0 2px 1px #555;
    }

    .black-piece {
      color: #555;
      -webkit-text-stroke: 1px #242424;
      text-shadow: 0 2px 1px #222;
    }

    .square-coordinate {
      position: absolute;
      z-index: 2;
      left: 5px;
      top: 4px;
      font-size: clamp(10px, 2.2vw, 18px);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .square-coordinate.file {
      left: auto;
      top: auto;
      right: 5px;
      bottom: 4px;
    }

    .light .square-coordinate {
      color: var(--dark-square);
    }

    .dark .square-coordinate {
      color: var(--light-square);
    }

    .legal-dot {
      position: absolute;
      z-index: 0;
      width: 25%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.24);
      pointer-events: none;
    }

    .capture-ring {
      position: absolute;
      z-index: 0;
      inset: 5%;
      border: clamp(3px, 0.7vw, 7px) solid rgba(0, 0, 0, 0.24);
      border-radius: 50%;
      pointer-events: none;
    }

    .game-footer {
      width: min(100%, 1160px);
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 12px;
      background: var(--panel);
      flex-shrink: 0;
    }

    .footer-button {
      padding: 7px 12px;
      border: 1px solid #494643;
      border-radius: 6px;
      background: #3a3734;
      color: #f5f5f5;
      font-size: 12px;
    }

    .footer-button:hover {
      background: #4a4642;
    }

    #gameMessage {
      color: #c7c4c0;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .setup-card {
        padding: 22px;
      }

      .player-bar {
        min-height: 42px;
        padding: 4px 8px;
      }

      .player-icon {
        width: 32px;
        height: 32px;
        font-size: 24px;
      }

      #board {
        width: min(100vw, calc(100dvh - 100px));
      }

      .square-coordinate {
        left: 3px;
        top: 3px;
      }

      .square-coordinate.file {
        right: 3px;
        bottom: 3px;
      }

      .game-footer {
        min-height: 34px;
        padding: 4px 8px;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .player-bar {
        min-height: 30px;
        padding: 2px 8px;
      }

      .player-icon {
        width: 24px;
        height: 24px;
        font-size: 18px;
      }

      .player-name {
        font-size: 12px;
      }

      .player-detail {
        display: none;
      }

      #status {
        padding: 2px 8px;
        font-size: 11px;
      }

      #board {
        width: min(calc(100dvh - 76px), 100vw);
      }

      .game-footer {
        min-height: 24px;
        padding: 2px 8px;
      }

      .footer-button {
        padding: 3px 8px;
      }
    }
  </style>


</head>


<body>
  <!-- First screen: choose settings -->
  <main id="setupScreen">
    <section class="setup-card">
      <h1>Chess vs AI</h1>
      <p class="setup-subtitle">Choose your settings, then play.</p>


<div class="setup-field">
<label for="difficulty">AI difficulty</label>
<select id="difficulty">
<option value="easy">Easy</option>
<option value="medium" selected>Medium</option>
<option value="hard">Hard</option>
</select>
</div>

<div class="setup-field">
<label for="playerColor">Play as</label>
<select id="playerColor">
<option value="w">White</option>
<option value="b">Black</option>
<option value="random">Random</option>
</select>
</div>

<button class="play-button" id="playButton" type="button">Play</button>
</section>

  </main>


  <!-- Game screen: board fills the available height -->


  <main id="gameScreen" hidden>
    <div class="player-bar opponent">
      <div class="player-icon" aria-hidden="true">♟</div>
      <div class="player-info">
        <span class="player-name">Opponent</span>
        <span class="player-detail" id="opponentDetail">AI</span>
      </div>
    </div>


<div id="status" aria-live="polite">Your turn</div>

<div id="board" aria-label="Chess board"></div>

<div class="player-bar player">
<div class="player-icon" aria-hidden="true">♟</div>
<div class="player-info">
<span class="player-name">Player</span>
<span class="player-detail" id="playerDetail">White</span>
</div>
</div>

<div class="game-footer">
<button class="footer-button" id="newGameButton" type="button">New game</button>
<span id="gameMessage">Click a piece, then a square.</span>
<button class="footer-button" id="settingsButton" type="button">Settings</button>
</div>

  </main>


  <script>
    const setupScreen = document.getElementById("setupScreen");
    const gameScreen = document.getElementById("gameScreen");
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const difficultyElement = document.getElementById("difficulty");
    const colorElement = document.getElementById("playerColor");
    const opponentDetail = document.getElementById("opponentDetail");
    const playerDetail = document.getElementById("playerDetail");
    const gameMessage = document.getElementById("gameMessage");

    if (typeof Chess === "undefined") {
      document.querySelector(".setup-subtitle").textContent =
        "Could not load chess.js. Check your internet connection and reload.";
      throw new Error("chess.js failed to load");
    }

    const game = new Chess();
    const files = "abcdefgh";

    const symbols = {
      w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
      b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
    };

    const values = {
      p: 100,
      n: 320,
      b: 330,
      r: 500,
      q: 900,
      k: 0
    };

    let playerColor = "w";
    let selectedSquare = null;
    let thinking = false;
    let gameVersion = 0;
    let lastMove = null;

    function startGame() {
      gameVersion++;
      game.reset();

      selectedSquare = null;
      thinking = false;
      lastMove = null;

      playerColor = colorElement.value === "random"
        ? (Math.random() < 0.5 ? "w" : "b")
        : colorElement.value;

      setupScreen.hidden = true;
      gameScreen.hidden = false;

      playerDetail.textContent = playerColor === "w" ? "White" : "Black";
      opponentDetail.textContent =
        difficultyElement.options[difficultyElement.selectedIndex].text;

      renderBoard();

      if (game.turn() !== playerColor) {
        scheduleAiMove();
      }
    }

    function returnToSettings() {
      gameVersion++;
      thinking = false;
      setupScreen.hidden = false;
      gameScreen.hidden = true;
    }

    function updateStatus() {
      if (game.in_checkmate()) {
        statusElement.textContent =
          game.turn() === playerColor
            ? "Checkmate — the AI wins."
            : "Checkmate — you win!";
        return;
      }

      if (game.in_draw()) {
        statusElement.textContent = "Draw!";
        return;
      }

      if (thinking) {
        statusElement.textContent = "AI is thinking…";
        return;
      }

      const turnText = game.turn() === playerColor ? "Your turn" : "AI's turn";
      statusElement.textContent =
        turnText + (game.in_check() ? " — check!" : "");
    }

    function renderBoard() {
      boardElement.innerHTML = "";

      const legalMoves = selectedSquare
        ? game.moves({ square: selectedSquare, verbose: true })
        : [];

      const ranks = playerColor === "w"
        ? [8, 7, 6, 5, 4, 3, 2, 1]
        : [1, 2, 3, 4, 5, 6, 7, 8];

      const boardFiles = playerColor === "w"
        ? [...files]
        : [...files].reverse();

      for (const rank of ranks) {
        for (const file of boardFiles) {
          const square = file + rank;
          const piece = game.get(square);
          const legalMove = legalMoves.find(move => move.to === square);
          const button = document.createElement("button");

          button.type = "button";
          button.className = "square " +
            ((files.indexOf(file) + rank) % 2 === 0 ? "dark" : "light");

          if (square === selectedSquare) {
            button.classList.add("selected");
          }

          if (lastMove && (square === lastMove.from || square === lastMove.to)) {
            button.classList.add("last-move");
          }

          if (legalMove) {
            const marker = document.createElement("span");
            marker.className = piece ? "capture-ring" : "legal-dot";
            button.appendChild(marker);
          }

          if (piece) {
            const pieceElement = document.createElement("span");
            pieceElement.className =
              "piece " + (piece.color === "w" ? "white-piece" : "black-piece");
            pieceElement.textContent = symbols[piece.color][piece.type];
            button.appendChild(pieceElement);
          }

          if (file === boardFiles[0]) {
            const rankLabel = document.createElement("span");
            rankLabel.className = "square-coordinate";
            rankLabel.textContent = rank;
            button.appendChild(rankLabel);
          }

          if (rank === ranks[ranks.length - 1]) {
            const fileLabel = document.createElement("span");
            fileLabel.className = "square-coordinate file";
            fileLabel.textContent = file;
            button.appendChild(fileLabel);
          }

          button.setAttribute(
            "aria-label",
            square + (piece
              ? ` ${piece.color === "w" ? "white" : "black"} ${piece.type}`
              : "")
          );

          button.addEventListener("click", () => handleSquareClick(square));
          boardElement.appendChild(button);
        }
      }

      updateStatus();
    }

    function handleSquareClick(square) {
      if (thinking || game.game_over() || game.turn() !== playerColor) {
        return;
      }

      const clickedPiece = game.get(square);

      if (selectedSquare) {
        const move = game.move({
          from: selectedSquare,
          to: square,
          promotion: "q"
        });

        if (move) {
          lastMove = { from: move.from, to: move.to };
          selectedSquare = null;
          gameMessage.textContent = "Click a piece, then a square.";
          scheduleAiMove();
          return;
        }
      }

      selectedSquare =
        clickedPiece && clickedPiece.color === playerColor ? square : null;

      renderBoard();
    }

    function scheduleAiMove() {
      if (game.game_over() || game.turn() === playerColor) {
        renderBoard();
        return;
      }

      thinking = true;
      const version = gameVersion;
      renderBoard();

      setTimeout(() => {
        if (version !== gameVersion) return;
        makeAiMove();
      }, 60);
    }

    // Scores are positive for Black and negative for White.
    function evaluatePosition() {
      if (game.in_checkmate()) {
        return game.turn() === "w" ? 100000 : -100000;
      }

      if (game.in_draw()) return 0;

      let score = 0;
      const position = game.board();

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = position[row][col];
          if (!piece) continue;

          let value = values[piece.type];
          const center =
            3.5 - (Math.abs(3.5 - row) + Math.abs(3.5 - col)) / 2;

          if (piece.type === "n" || piece.type === "b") {
            value += center * 12;
          }

          if (piece.type === "p") {
            value += center * 4;
            value += (piece.color === "w" ? 6 - row : row - 1) * 6;
          }

          score += piece.color === "b" ? value : -value;
        }
      }

      return score;
    }

    function getOrderedMoves() {
      return game.moves({ verbose: true }).sort((a, b) => {
        const priority = move =>
          (move.captured ? values[move.captured] * 10 - values[move.piece] : 0) +
          (move.promotion ? 800 : 0);

        return priority(b) - priority(a);
      });
    }

    function minimax(depth, alpha, beta) {
      if (depth === 0 || game.game_over()) {
        return evaluatePosition();
      }

      const maximizing = game.turn() === "b";
      let best = maximizing ? -Infinity : Infinity;

      for (const move of getOrderedMoves()) {
        game.move(move);
        const score = minimax(depth - 1, alpha, beta);
        game.undo();

        if (maximizing) {
          best = Math.max(best, score);
          alpha = Math.max(alpha, best);
        } else {
          best = Math.min(best, score);
          beta = Math.min(beta, best);
        }

        if (beta <= alpha) break;
      }

      return best;
    }

    function makeAiMove() {
      const difficulty = difficultyElement.value;
      const moves = getOrderedMoves();

      if (!moves.length) {
        thinking = false;
        renderBoard();
        return;
      }

      if (difficulty === "easy" && Math.random() < 0.55) {
        game.move(moves[Math.floor(Math.random() * moves.length)]);
      } else {
        const depth = difficulty === "hard" ? 3 : difficulty === "medium" ? 2 : 1;
        const aiIsBlack = game.turn() === "b";
        const scoredMoves = [];

        for (const move of moves) {
          game.move(move);
          const score = minimax(depth - 1, -Infinity, Infinity);
          game.undo();
          scoredMoves.push({ move, score });
        }

        scoredMoves.sort((a, b) =>
          aiIsBlack ? b.score - a.score : a.score - b.score
        );

        let choice = 0;

        if (difficulty === "easy") {
          choice = Math.floor(Math.random() * Math.min(4, scoredMoves.length));
        } else if (difficulty === "medium" && Math.random() < 0.2) {
          choice = Math.floor(Math.random() * Math.min(3, scoredMoves.length));
        }

        game.move(scoredMoves[choice].move);
      }

      const history = game.history({ verbose: true });
      const move = history[history.length - 1];
      lastMove = { from: move.from, to: move.to };

      thinking = false;
      renderBoard();
    }

    document.getElementById("playButton").addEventListener("click", startGame);

    document.getElementById("newGameButton").addEventListener("click", startGame);

    document.getElementById("settingsButton").addEventListener(
      "click",
      returnToSettings
    );
  </script>


</body>
</html>
