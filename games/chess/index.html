<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess vs AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #2d2b29;
      --panel-hover: #3a3734;
      --light: #f0f0f0;
      --dark: #555;
      --text: #f5f5f5;
      --muted: #aaa;
      --accent: #779556;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    /* Setup screen */

    #setupScreen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .setup-card {
      width: min(100%, 390px);
      padding: 28px;
      border: 1px solid #242424;
      border-radius: 14px;
      background: #111;
    }

    .setup-card h1 {
      margin: 0;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.6px;
    }

    .setup-card p {
      margin: 8px 0 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 19px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
    }

    .field select {
      width: 100%;
      padding: 12px;
      border: 1px solid #383838;
      border-radius: 7px;
      background: #1b1b1b;
      color: var(--text);
    }

    .primary-button {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: white;
      font-weight: 700;
    }

    .primary-button:hover {
      background: #89a867;
    }

    /* Game layout */

    #gameScreen {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .player-bar {
      width: min(100%, 1100px);
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px;
      background: var(--panel);
      flex-shrink: 0;
    }

    .player-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 4px;
      background: #45423f;
      color: #bdbbb8;
      font-family: "Segoe UI Symbol", "DejaVu Sans", serif;
      font-size: 24px;
    }

    .player-name {
      font-size: 13px;
      font-weight: 700;
    }

    .player-detail {
      margin-top: 1px;
      color: #c1bfbc;
      font-size: 11px;
    }

    #status {
      width: min(100%, 1100px);
      min-height: 26px;
      display: grid;
      place-items: center;
      padding: 3px 8px;
      color: #d1d1d1;
      font-size: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    #board {
      width: min(100vw, 1100px, calc(100dvh - 145px));
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      grid-template-rows: repeat(8, minmax(0, 1fr));
      overflow: hidden;
      flex-shrink: 0;
      border-radius: 2px;
      touch-action: manipulation;
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .square.light {
      background: var(--light);
    }

    .square.dark {
      background: var(--dark);
    }

    .square.selected {
      background: #9cae62;
    }

    .square.last-move.light {
      background: #d8d8b8;
    }

    .square.last-move.dark {
      background: #718b50;
    }

    .square:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
      z-index: 3;
    }

    /* Filled silhouettes, colored by side */

    .piece {
      display: block;
      position: relative;
      z-index: 1;
      font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif;
      font-size: clamp(26px, 7.5vw, 76px);
      line-height: 1;
      pointer-events: none;
      transform: translateY(-1%);
    }

    .white-piece {
      color: #fff;
      -webkit-text-stroke: 0.6px #777;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    .black-piece {
      color: #292929;
      -webkit-text-stroke: 0.7px #111;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
    }

    .coordinate {
      position: absolute;
      z-index: 2;
      left: 4px;
      top: 3px;
      font-size: clamp(10px, 1.5vw, 15px);
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
    }

    .coordinate.file {
      left: auto;
      top: auto;
      right: 4px;
      bottom: 3px;
    }

    .light .coordinate {
      color: #666;
    }

    .dark .coordinate {
      color: #f0f0f0;
    }

    .legal-dot {
      position: absolute;
      z-index: 0;
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    .capture-ring {
      position: absolute;
      z-index: 0;
      inset: 5%;
      border: clamp(3px, 0.6vw, 6px) solid rgba(0, 0, 0, 0.25);
      border-radius: 50%;
      pointer-events: none;
    }

    .game-footer {
      width: min(100%, 1100px);
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 10px;
      background: var(--panel);
      flex-shrink: 0;
    }

    .footer-button {
      padding: 7px 11px;
      border: 1px solid #494643;
      border-radius: 6px;
      background: #383532;
      color: #f5f5f5;
      font-size: 12px;
    }

    .footer-button:hover {
      background: var(--panel-hover);
    }

    #gameMessage {
      color: #c7c4c0;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .setup-card {
        padding: 22px;
      }

      #board {
        width: min(100vw, calc(100dvh - 125px));
      }

      .player-bar {
        min-height: 38px;
        padding: 3px 8px;
      }

      .player-icon {
        width: 29px;
        height: 29px;
        font-size: 22px;
      }

      .coordinate {
        left: 3px;
        top: 3px;
      }

      .coordinate.file {
        right: 3px;
        bottom: 3px;
      }

      .game-footer {
        min-height: 32px;
        padding: 3px 6px;
      }

      .footer-button {
        padding: 6px 8px;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .player-bar {
        min-height: 27px;
        padding: 2px 8px;
      }

      .player-icon {
        width: 22px;
        height: 22px;
        font-size: 17px;
      }

      .player-detail {
        display: none;
      }

      #status {
        min-height: 20px;
      }

      #board {
        width: min(calc(100dvh - 92px), 100vw);
      }

      .game-footer {
        min-height: 24px;
        padding: 2px 8px;
      }

      .footer-button {
        padding: 3px 8px;
      }
    }
  </style>
</head>

<body>
  <main id="setupScreen">
    <section class="setup-card">
      <h1>Chess vs AI</h1>
      <p>Choose your settings, then play.</p>

      <div class="field">
        <label for="difficulty">AI difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="field">
        <label for="playerColor">Play as</label>
        <select id="playerColor">
          <option value="w">White</option>
          <option value="b">Black</option>
          <option value="random">Random</option>
        </select>
      </div>

      <button class="primary-button" id="playButton" type="button">Play</button>
    </section>
  </main>

  <main id="gameScreen" hidden>
    <div class="player-bar">
      <div class="player-icon" aria-hidden="true">♟</div>
      <div>
        <div class="player-name">Opponent</div>
        <div class="player-detail" id="opponentDetail">Medium</div>
      </div>
    </div>

    <div id="status" aria-live="polite"></div>
    <div id="board" aria-label="Chess board"></div>

    <div class="player-bar">
      <div class="player-icon" aria-hidden="true">♟</div>
      <div>
        <div class="player-name">Player</div>
        <div class="player-detail" id="playerDetail">White</div>
      </div>
    </div>

    <div class="game-footer">
      <button class="footer-button" id="newGameButton" type="button">New game</button>
      <span id="gameMessage">Select a piece, then a square.</span>
      <button class="footer-button" id="settingsButton" type="button">Settings</button>
    </div>
  </main>

  <script>
    const setupScreen = document.getElementById("setupScreen");
    const gameScreen = document.getElementById("gameScreen");
    const boardElement = document.getElementById("board");
    const statusElement = document.getElementById("status");
    const difficultyElement = document.getElementById("difficulty");
    const colorElement = document.getElementById("playerColor");
    const opponentDetail = document.getElementById("opponentDetail");
    const playerDetail = document.getElementById("playerDetail");
    const gameMessage = document.getElementById("gameMessage");

    if (typeof Chess === "undefined") {
      document.querySelector(".setup-card p").textContent =
        "Could not load chess.js. Check your internet connection and reload.";
      throw new Error("chess.js failed to load");
    }

    const game = new Chess();
    const files = "abcdefgh";

    // Use the filled black-piece glyphs for both sides, then color them.
    const pieces = {
      k: "♚",
      q: "♛",
      r: "♜",
      b: "♝",
      n: "♞",
      p: "♟"
    };

    const values = {
      p: 100,
      n: 320,
      b: 330,
      r: 500,
      q: 900,
      k: 20000
    };

    let playerColor = "w";
    let selectedSquare = null;
    let thinking = false;
    let gameVersion = 0;
    let lastMove = null;

    function startGame() {
      gameVersion++;
      game.reset();

      selectedSquare = null;
      thinking = false;
      lastMove = null;

      playerColor = colorElement.value === "random"
        ? (Math.random() < 0.5 ? "w" : "b")
        : colorElement.value;

      setupScreen.hidden = true;
      gameScreen.hidden = false;

      playerDetail.textContent = playerColor === "w" ? "White" : "Black";
      opponentDetail.textContent =
        difficultyElement.options[difficultyElement.selectedIndex].text;

      renderBoard();

      if (game.turn() !== playerColor) {
        scheduleAiMove();
      }
    }

    function returnToSettings() {
      gameVersion++;
      thinking = false;
      setupScreen.hidden = false;
      gameScreen.hidden = true;
    }

    function updateStatus() {
      if (game.in_checkmate()) {
        statusElement.textContent =
          game.turn() === playerColor
            ? "Checkmate — the AI wins."
            : "Checkmate — you win!";
        return;
      }

      if (game.in_draw()) {
        statusElement.textContent = "Draw!";
        return;
      }

      if (thinking) {
        statusElement.textContent = "AI is thinking…";
        return;
      }

      statusElement.textContent =
        (game.turn() === playerColor ? "Your turn" : "AI's turn") +
        (game.in_check() ? " — check!" : "");
    }

    function renderBoard() {
      boardElement.innerHTML = "";

      const legalMoves = selectedSquare
        ? game.moves({ square: selectedSquare, verbose: true })
        : [];

      // Standard board orientation: White at the bottom.
      const ranks = [8, 7, 6, 5, 4, 3, 2, 1];

      for (const rank of ranks) {
        for (const file of [...files]) {
          const square = file + rank;
          const piece = game.get(square);
          const legalMove = legalMoves.find(move => move.to === square);
          const button = document.createElement("button");

          button.type = "button";
          button.className = "square " +
            ((files.indexOf(file) + rank) % 2 === 0 ? "dark" : "light");

          if (square === selectedSquare) {
            button.classList.add("selected");
          }

          if (lastMove && (square === lastMove.from || square === lastMove.to)) {
            button.classList.add("last-move");
          }

          if (legalMove) {
            const marker = document.createElement("span");
            marker.className = piece ? "capture-ring" : "legal-dot";
            button.appendChild(marker);
          }

          if (piece) {
            const pieceElement = document.createElement("span");
            pieceElement.className =
              "piece " + (piece.color === "w" ? "white-piece" : "black-piece");
            pieceElement.textContent = pieces[piece.type];
            button.appendChild(pieceElement);
          }

          if (file === "a") {
            const rankLabel = document.createElement("span");
            rankLabel.className = "coordinate";
            rankLabel.textContent = rank;
            button.appendChild(rankLabel);
          }

          if (rank === 1) {
            const fileLabel = document.createElement("span");
            fileLabel.className = "coordinate file";
            fileLabel.textContent = file;
            button.appendChild(fileLabel);
          }

          button.setAttribute(
            "aria-label",
            square + (piece
              ? ` ${piece.color === "w" ? "white" : "black"} ${piece.type}`
              : "")
          );

          button.addEventListener("click", () => handleSquareClick(square));
          boardElement.appendChild(button);
        }
      }

      updateStatus();
    }

    function handleSquareClick(square) {
      if (thinking || game.game_over() || game.turn() !== playerColor) {
        return;
      }

      const clickedPiece = game.get(square);

      if (selectedSquare) {
        const move = game.move({
          from: selectedSquare,
          to: square,
          promotion: "q"
        });

        if (move) {
          lastMove = { from: move.from, to: move.to };
          selectedSquare = null;
          scheduleAiMove();
          return;
        }
      }

      selectedSquare =
        clickedPiece && clickedPiece.color === playerColor ? square : null;

      renderBoard();
    }

    function scheduleAiMove() {
      if (game.game_over() || game.turn() === playerColor) {
        renderBoard();
        return;
      }

      thinking = true;
      const version = gameVersion;
      renderBoard();

      const difficulty = difficultyElement.value;

      // Easy: 2–5 seconds. Medium: 5–12. Hard: 10–20.
      const delay = difficulty === "easy"
        ? 2000 + Math.random() * 3000
        : difficulty === "medium"
          ? 5000 + Math.random() * 7000
          : 10000 + Math.random() * 10000;

      setTimeout(() => {
        if (version !== gameVersion || game.game_over()) return;
        makeAiMove();
      }, delay);
    }

    // Positive scores favor Black; negative scores favor White.
    function evaluatePosition() {
      if (game.in_checkmate()) {
        return game.turn() === "w" ? 100000 : -100000;
      }

      if (game.in_draw()) return 0;

      let score = 0;
      const position = game.board();

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = position[row][col];
          if (!piece) continue;

          let value = values[piece.type];
          const center =
            3.5 - (Math.abs(3.5 - row) + Math.abs(3.5 - col)) / 2;

          if (piece.type === "n" || piece.type === "b") {
            value += center * 12;
          }

          if (piece.type === "p") {
            value += center * 4;
            value += (piece.color === "w" ? 6 - row : row - 1) * 6;
          }

          score += piece.color === "b" ? value : -value;
        }
      }

      return score;
    }

    function getOrderedMoves() {
      return game.moves({ verbose: true }).sort((a, b) => {
        const priority = move =>
          (move.captured ? values[move.captured] * 10 - values[move.piece] : 0) +
          (move.promotion ? 800 : 0);

        return priority(b) - priority(a);
      });
    }

    function minimax(depth, alpha, beta) {
      if (depth === 0 || game.game_over()) {
        return evaluatePosition();
      }

      const maximizing = game.turn() === "b";
      let best = maximizing ? -Infinity : Infinity;

      for (const move of getOrderedMoves()) {
        game.move(move);
        const score = minimax(depth - 1, alpha, beta);
        game.undo();

        if (maximizing) {
          best = Math.max(best, score);
          alpha = Math.max(alpha, best);
        } else {
          best = Math.min(best, score);
          beta = Math.min(beta, best);
        }

        if (beta <= alpha) break;
      }

      return best;
    }

    function makeAiMove() {
      const difficulty = difficultyElement.value;
      const moves = getOrderedMoves();

      if (!moves.length) {
        thinking = false;
        renderBoard();
        return;
      }

      let chosenMove;

      if (difficulty === "easy" && Math.random() < 0.55) {
        chosenMove = moves[Math.floor(Math.random() * moves.length)];
      } else {
        const depth = difficulty === "hard" ? 3 : difficulty === "medium" ? 2 : 1;
        const aiIsBlack = game.turn() === "b";
        const scoredMoves = [];

        for (const move of moves) {
          game.move(move);
          const score = minimax(depth - 1, -Infinity, Infinity);
          game.undo();
          scoredMoves.push({ move, score });
        }

        scoredMoves.sort((a, b) =>
          aiIsBlack ? b.score - a.score : a.score - b.score
        );

        let choice = 0;

        if (difficulty === "easy") {
          choice = Math.floor(Math.random() * Math.min(4, scoredMoves.length));
        } else if (difficulty === "medium" && Math.random() < 0.2) {
          choice = Math.floor(Math.random() * Math.min(3, scoredMoves.length));
        }

        chosenMove = scoredMoves[choice].move;
      }

      const move = game.move(chosenMove);
      lastMove = { from: move.from, to: move.to };

      thinking = false;
      renderBoard();
    }

    document.getElementById("playButton").addEventListener("click", startGame);
    document.getElementById("newGameButton").addEventListener("click", startGame);
    document.getElementById("settingsButton").addEventListener("click", returnToSettings);
  </script>
</body>
</html>
