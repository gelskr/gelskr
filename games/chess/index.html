<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess vs. Bot</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #151922;
      color: #f4f5f8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    main {
      width: min(100%, 560px);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    .subtitle {
      color: #aab2c3;
      margin: 0 0 20px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    #status {
      font-weight: 600;
      min-height: 1.5em;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .controls button {
      border: 0;
      border-radius: 8px;
      padding: 9px 13px;
      background: #39445b;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    .controls button:hover {
      background: #4a5874;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      aspect-ratio: 1;
      border: 5px solid #30394a;
      border-radius: 8px;
      overflow: hidden;
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      font-family: "Segoe UI Symbol", "DejaVu Sans", sans-serif;
      font-size: clamp(30px, 8vw, 55px);
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .light { background: #e9dcc5; }
    .dark { background: #829477; }

    .square.white-piece {
      color: #fff;
      text-shadow: 0 1px 2px #111, 0 0 3px #111;
    }

    .square.black-piece {
      color: #20242a;
      text-shadow: 0 1px 1px #fff8;
    }

    .square.selected {
      box-shadow: inset 0 0 0 5px #f5d76e;
    }

    .square.possible::after {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: #17201b66;
      pointer-events: none;
    }

    .square.capture::after {
      width: 78%;
      height: 78%;
      background: transparent;
      border: 5px solid #17201b66;
    }

    .square:focus-visible {
      outline: 4px solid #4a90e2;
      outline-offset: -4px;
      z-index: 1;
    }

    .hint {
      color: #aab2c3;
      font-size: 0.9rem;
      margin-top: 14px;
    }

    #moves {
      color: #c5ccda;
      font-size: 0.9rem;
      line-height: 1.6;
      max-height: 100px;
      overflow-y: auto;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Chess vs. Bot</h1>
    <p class="subtitle">You are White. Click a piece, then its destination.</p>

    <div class="toolbar">
      <div id="status" aria-live="polite">Loading…</div>
      <div class="controls">
        <button id="undo" type="button">Undo</button>
        <button id="restart" type="button">New game</button>
      </div>
    </div>

    <div id="board" aria-label="Chess board"></div>
    <p class="hint">Pawns automatically promote to queens.</p>
    <div id="moves" aria-label="Move history"></div>
  </main>

  <script>
    const board = document.getElementById("board");
    const status = document.getElementById("status");
    const movesDisplay = document.getElementById("moves");

    if (typeof Chess === "undefined") {
      status.textContent = "Could not load chess.js. Check your internet connection.";
    } else {
      startGame();
    }

    function startGame() {
      const game = new Chess();
      const symbols = {
        w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
        b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
      };
      const names = {
        k: "king", q: "queen", r: "rook",
        b: "bishop", n: "knight", p: "pawn"
      };
      const values = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

      let selected = null;
      let botTimer = null;

      function render() {
        board.innerHTML = "";
        const possibleMoves = selected
          ? game.moves({ square: selected, verbose: true })
          : [];

        for (let rank = 8; rank >= 1; rank--) {
          for (let file = 0; file < 8; file++) {
            const squareName = "abcdefgh"[file] + rank;
            const piece = game.get(squareName);
            const move = possibleMoves.find(m => m.to === squareName);
            const square = document.createElement("button");

            square.type = "button";
            square.className = "square " +
              ((file + rank) % 2 === 0 ? "dark" : "light");

            if (piece) {
              square.textContent = symbols[piece.color][piece.type];
              square.classList.add(piece.color === "w" ? "white-piece" : "black-piece");
            }
            if (selected === squareName) square.classList.add("selected");
            if (move) {
              square.classList.add("possible");
              if (move.captured) square.classList.add("capture");
            }

            square.setAttribute(
              "aria-label",
              squareName + (piece
                ? `, ${piece.color === "w" ? "white" : "black"} ${names[piece.type]}`
                : ", empty")
            );
            square.addEventListener("click", () => handleSquare(squareName));
            board.appendChild(square);
          }
        }

        if (game.in_checkmate()) {
          status.textContent = game.turn() === "w"
            ? "Checkmate — bot wins."
            : "Checkmate — you win!";
        } else if (game.in_draw()) {
          status.textContent = "Draw!";
        } else if (game.turn() === "b") {
          status.textContent = "Bot is thinking…";
        } else {
          status.textContent = game.in_check() ? "Your turn — check!" : "Your turn";
        }

        const history = game.history();
        const pairs = [];
        for (let i = 0; i < history.length; i += 2) {
          pairs.push(`${Math.floor(i / 2) + 1}. ${history[i]} ${history[i + 1] || ""}`);
        }
        movesDisplay.textContent = pairs.join("  ");
      }

      function handleSquare(square) {
        if (game.game_over() || game.turn() !== "w") return;

        const piece = game.get(square);

        if (selected) {
          const move = game.move({ from: selected, to: square, promotion: "q" });
          if (move) {
            selected = null;
            render();
            if (!game.game_over()) {
              botTimer = setTimeout(botMove, 350);
            }
            return;
          }
        }

        selected = piece && piece.color === "w" ? square : null;
        render();
      }

      function botMove() {
        botTimer = null;
        if (game.game_over() || game.turn() !== "b") return;

        const moves = game.moves({ verbose: true });
        // Prefer captures and promotions, with randomness for variety.
        const scored = moves.map(move => ({
          move,
          score: Math.random() * 2 +
            (move.captured ? values[move.captured] : 0) +
            (move.promotion ? 8 : 0)
        }));
        scored.sort ( (a, b) => b.score - a.score );
        game.move(scored[0].move);
        render();
      }

      document.getElementById("restart").addEventListener("click", () => {
        clearTimeout(botTimer);
        botTimer = null;
        game.reset();
        selected = null;
        render();
      });

      document.getElementById("undo").addEventListener("click", () => {
        clearTimeout(botTimer);
        botTimer = null;

        // Undo the bot's move and the preceding player move, if present.
        if (game.turn() === "w" && game.history().length) game.undo();
        if (game.turn() === "b" && game.history().length) game.undo();

        selected = null;
        render();
      });

      render();
    }
  </script>
</body>
</html>
