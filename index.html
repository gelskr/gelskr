<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #090909;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 28px 16px;
      background: #0e0e0e;
      border-right: 1px solid #222;
    }

    .logo {
      margin: 0 10px 32px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-item {
      padding: 12px;
      border-radius: 8px;
      background: #202020;
      font-size: 14px;
    }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      padding: 32px;
      gap: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-button {
      padding: 10px 16px;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      background: #151515;
      color: #ccc;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .game-button:hover {
      background: #222;
      color: white;
    }

    .game-button.active {
      border-color: #777;
      background: #292929;
      color: white;
    }

    .viewer {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #222;
      border-radius: 12px;
      background: #111;
    }

    .placeholder {
      display: grid;
      height: 100%;
      place-items: center;
      color: #666;
      font-size: 14px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      .sidebar {
        width: 100px;
        padding: 24px 10px;
      }

      .logo { font-size: 12px; }
      main { padding: 20px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">My Hub</div>
      <div class="nav-item">Games</div>
    </aside>

    <main>
      <header>
        <h1>library</h1>
        <p>pick</p>
      </header>

      <div id="gameList" class="game-list"></div>

      <div class="viewer">
        <div id="placeholder" class="placeholder">Select a game to play</div>
        <iframe id="gameFrame" title="Game viewer" hidden></iframe>
      </div>
    </main>
  </div>

  <script>
    // Add your games here.
    const games = [
      { name: "Game 1", path: "games/game1/index.html" },
      { name: "Game 2", path: "games/game2/index.html" }
    ];

    const gameList = document.getElementById("gameList");
    const gameFrame = document.getElementById("gameFrame");
    const placeholder = document.getElementById("placeholder");

    games.forEach(game => {
      const button = document.createElement("button");
      button.className = "game-button";
      button.textContent = game.name;

      button.addEventListener("click", () => {
        document.querySelectorAll(".game-button").forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        placeholder.hidden = true;
        gameFrame.hidden = false;
        gameFrame.src = game.path;
      });

      gameList.appendChild(button);
    });
  </script>
</body>
</html>
