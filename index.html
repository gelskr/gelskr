<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>

  <link rel="stylesheet" href="style.css">

  <style>
    #exitDialog {
      width: min(320px, calc(100% - 64px));
      border: 1px solid #454545;
      border-radius: 20px;
      padding: 32px;
      background: #222;
      color: #fff;
      text-align: center;
      font-family: inherit;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
      animation: dialog-in 180ms ease-out;
    }

    #exitDialog::backdrop {
      background: rgba(0, 0, 0, 0.65);
    }

    #exitDialog h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    #exitDialog p {
      margin: 10px 0 0;
      color: #aaa;
      font-size: 14px;
    }

    .exit-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 26px;
    }

    .exit-actions button {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border: 1px solid #505050;
      border-radius: 16px;
      background: #333;
      color: #ddd;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease,
                  border-color 160ms ease;
    }

    .exit-actions button:hover {
      background: #444;
      border-color: #666;
      transform: translateY(-3px);
    }

    .exit-actions button:active {
      transform: scale(0.95);
    }

    .exit-actions button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .exit-actions svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes dialog-in {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #exitDialog {
        animation: none;
      }

      .exit-actions button {
        transition: none;
      }
    }

    /* Remove the white outline around the game frame. */
    #gameFrame:focus {
      outline: none;
    }

    /* Loading text displayed over the black game background. */
    .loading-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #888;
      font-size: 16px;
      pointer-events: none;
      z-index: 2;
    }

    .viewer {
      position: relative;
    }

    .loading-label[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <!-- Game library -->
  <main id="library" class="library">
    <header class="library-header">
      <h1>library</h1>
      <p>pick a game and play</p>
    </header>

    <div id="gameList" class="game-list"></div>
  </main>

  <!-- Game window -->
  <section
    id="gameView"
    class="game-view"
    aria-label="Game view"
    hidden
  >
    <div class="topbar">
      <div class="controls">
        <button
          id="fullscreenButton"
          class="control-button"
          type="button"
          aria-label="Enter fullscreen"
          title="Enter fullscreen"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/>
          </svg>
        </button>

        <button
          id="muteButton"
          class="control-button"
          type="button"
          aria-label="Mute game"
          title="Mute game"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/>
            <path class="mute-slash" d="M3 3l18 18"/>
          </svg>
        </button>
      </div>

      <button
        id="backButton"
        class="control-button"
        type="button"
        aria-label="Back to library"
        title="Back to library"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <div class="viewer">
      <div id="loadingLabel" class="loading-label" hidden>loading...</div>

      <iframe
        id="gameFrame"
        title="Game viewer"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>
    </div>
  </section>

  <!-- Exit confirmation -->
  <dialog id="exitDialog" aria-labelledby="exitTitle">
    <h2 id="exitTitle">are you sure?</h2>
    <p>make sure you saved</p>

    <div class="exit-actions">
      <button
        id="confirmExit"
        class="exit-confirm"
        type="button"
        aria-label="Confirm exit"
        title="Exit game"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12l5 5L19 7"/>
        </svg>
      </button>

      <button
        id="cancelExit"
        class="exit-cancel"
        type="button"
        aria-label="Cancel and return to game"
        title="Return to game"
        autofocus
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </dialog>

  <script>
    const games = [
      { name: "minecraft", path: "games/eagler/index.html" },
      { name: "geometry dash", path: "games/geometry/index.html" },
      { name: "flappy bird", path: "games/flappybird/index.html" }
    ];

    const library = document.getElementById("library");
    const gameList = document.getElementById("gameList");
    const gameView = document.getElementById("gameView");
    const frame = document.getElementById("gameFrame");
    const loadingLabel = document.getElementById("loadingLabel");
    const fullscreenButton = document.getElementById("fullscreenButton");
    const muteButton = document.getElementById("muteButton");
    const backButton = document.getElementById("backButton");
    const exitDialog = document.getElementById("exitDialog");
    const cancelExit = document.getElementById("cancelExit");
    const confirmExit = document.getElementById("confirmExit");

    let muted = false;
    let mediaObserver = null;
    let lastGameButton = null;
    let switchingScreen = false;

    // Return keyboard focus to Eaglercraft's canvas when possible.
    function focusGame() {
      if (gameView.hidden || exitDialog.open) return;

      frame.focus();

      try {
        const gameWindow = frame.contentWindow;
        const gameDocument = frame.contentDocument;

        gameWindow.focus();

        const canvas = gameDocument.querySelector("canvas");

        if (canvas) {
          if (!canvas.hasAttribute("tabindex")) {
            canvas.tabIndex = -1;
          }

          canvas.focus();
        }
      } catch (error) {
        // Cross-origin games may not allow access to their canvas.
      }
    }

    function updateMuteButton() {
      const label = muted ? "Unmute game" : "Mute game";

      muteButton.setAttribute("aria-pressed", String(muted));
      muteButton.setAttribute("aria-label", label);
      muteButton.title = label;
    }

    // Controls standard audio/video elements in same-origin games.
    function applyMute() {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;

        doc.querySelectorAll("audio, video").forEach(media => {
          media.muted = muted;
        });
      } catch (error) {
        // Cross-origin frames cannot be controlled by the parent page.
      }
    }

    function observeGameMedia() {
      if (mediaObserver) {
        mediaObserver.disconnect();
        mediaObserver = null;
      }

      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.documentElement) return;

        applyMute();

        mediaObserver = new MutationObserver(() => {
          if (muted) applyMute();
        });

        mediaObserver.observe(doc.documentElement, {
          childList: true,
          subtree: true
        });
      } catch (error) {
        // The game may be cross-origin.
      }
    }

    function waitForTransition() {
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      return new Promise(resolve => {
        setTimeout(resolve, reducedMotion ? 0 : 220);
      });
    }

    function fadeIn(element) {
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          element.classList.remove("screen-leaving");
        });
      });
    }

    async function openGame(game, button) {
      if (switchingScreen) return;

      switchingScreen = true;
      lastGameButton = button;

      library.classList.add("screen-leaving");
      await waitForTransition();

      library.hidden = true;
      library.classList.remove("screen-leaving");

      gameView.classList.add("screen-leaving");
      gameView.hidden = false;

      frame.title = game.name;

      // Show loading text before starting the game.
      loadingLabel.hidden = false;
      frame.src = game.path;

      fadeIn(gameView);
      focusGame();

      await waitForTransition();
      switchingScreen = false;
    }

    async function returnToLibrary() {
      if (switchingScreen) return;

      switchingScreen = true;

      gameView.classList.add("screen-leaving");
      await waitForTransition();

      if (document.fullscreenElement === gameView) {
        try {
          await document.exitFullscreen();
        } catch (error) {
          // Continue returning to the library if exiting fails.
        }
      }

      if (mediaObserver) {
        mediaObserver.disconnect();
        mediaObserver = null;
      }

      // Unload the game so its audio and activity stop.
      frame.removeAttribute("src");

      gameView.hidden = true;
      gameView.classList.remove("screen-leaving");

      library.classList.add("screen-leaving");
      library.hidden = false;

      fadeIn(library);

      if (lastGameButton) {
        lastGameButton.focus();
      }

      await waitForTransition();
      switchingScreen = false;
    }

    // Hide loading text once the game finishes loading.
    frame.addEventListener("load", () => {
      loadingLabel.hidden = true;
      observeGameMedia();
      focusGame();
    });

    muteButton.addEventListener("click", () => {
      muted = !muted;
      updateMuteButton();
      applyMute();
      focusGame();
    });

    backButton.addEventListener("click", () => {
      if (!switchingScreen && !exitDialog.open) {
        exitDialog.showModal();
      }
    });

    cancelExit.addEventListener("click", () => {
      exitDialog.close();
      focusGame();
    });

    confirmExit.addEventListener("click", () => {
      exitDialog.close();
      returnToLibrary();
    });

    // Pressing Esc cancels the confirmation.
    exitDialog.addEventListener("cancel", () => {
      setTimeout(focusGame, 0);
    });

    fullscreenButton.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement === gameView) {
          await document.exitFullscreen();
        } else {
          await gameView.requestFullscreen();
        }

        focusGame();
      } catch (error) {
        alert("Fullscreen isn't available in this browser.");
        focusGame();
      }
    });

    document.addEventListener("fullscreenchange", () => {
      const isFullscreen = document.fullscreenElement === gameView;
      const label = isFullscreen ? "Exit fullscreen" : "Enter fullscreen";

      fullscreenButton.setAttribute("aria-label", label);
      fullscreenButton.title = label;

      // Give the browser time to finish switching fullscreen.
      setTimeout(focusGame, 150);
    });

    games.forEach(game => {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "game-card";
      button.setAttribute("aria-label", `Play ${game.name}`);

      const iconWrap = document.createElement("span");
      iconWrap.className = "icon-wrap";

      const icon = document.createElement("img");
      icon.className = "game-icon";
      icon.alt = "";
      icon.loading = "lazy";

      let usingFallback = false;

      icon.addEventListener("error", () => {
        if (!usingFallback) {
          usingFallback = true;
          icon.src = "replacement.png";
        } else {
          // If both images are missing, show the first letter.
          icon.remove();
          iconWrap.textContent = game.name.charAt(0);
        }
      });

      // games/eagler/index.html -> games/eagler/icon.png
      icon.src = game.path.replace(/[^/]+$/, "icon.png");

      const name = document.createElement("span");
      name.className = "game-name";
      name.textContent = game.name;

      iconWrap.appendChild(icon);
      button.append(iconWrap, name);

      button.addEventListener("click", () => {
        openGame(game, button);
      });

      gameList.appendChild(button);
    });

    updateMuteButton();
  </script>
</body>
</html>
