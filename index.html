<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: #080808;
      color: #f5f5f5;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: min(100%, 1400px);
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: 32px;
      animation: enter .5s ease both;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.05em;
    }

    header p {
      margin: 6px 0 0;
      color: #777;
      font-size: 14px;
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-button {
      padding: 10px 16px;
      border: 1px solid #292929;
      border-radius: 9px;
      background: #151515;
      color: #aaa;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease,
                  border-color .2s ease, color .2s ease;
    }

    .game-button:hover {
      transform: translateY(-2px);
      border-color: #505050;
      background: #202020;
      color: #fff;
    }

    .game-button:active {
      transform: scale(.97);
    }

    .game-button.active {
      border-color: #777;
      background: #292929;
      color: #fff;
    }

    .game-button:focus-visible {
      outline: 2px solid #aaa;
      outline-offset: 3px;
    }

    .viewer {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #252525;
      border-radius: 16px;
      background: #101010;
    }

    .placeholder {
      display: grid;
      height: 100%;
      place-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
    }

    .placeholder strong {
      color: #aaa;
      font-size: 15px;
      font-weight: 600;
    }

    .placeholder span {
      color: #666;
      font-size: 13px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      animation: enter .4s ease both;
    }

    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      main {
        gap: 16px;
        padding: 20px 14px;
      }

      h1 {
        font-size: 24px;
      }

      .game-button {
        padding: 9px 13px;
        font-size: 13px;
      }

      .viewer {
        border-radius: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>library</h1>
        <p>pick a game and play</p>
      </div>
    </header>

    <div id="gameList" class="game-list"></div>

    <div class="viewer">
      <div id="placeholder" class="placeholder">
        <strong>ready to play?</strong>
        <span>select a game above</span>
      </div>

      <iframe id="gameFrame" title="Game viewer" hidden></iframe>
    </div>
  </main>

  <script>
    // Add more games here.
    const games = [
      { name: "snake", path: "games/snake/index.html" },
      { name: "2048", path: "games/2048/index.html" },
      { name: "flappy bird", path: "games/flappybird/index.html" },
      { name: "minesweeper", path: "games/minesweeper/index.html" },
      { name: "pong", path: "games/pong/index.html" },
      { name: "reaction test", path: "games/reaction/index.html" },
      { name: "minecraft 26.2", path: "games/eagler/index.html" }
    ];

    const list = document.getElementById("gameList");
    const frame = document.getElementById("gameFrame");
    const placeholder = document.getElementById("placeholder");

    games.forEach(game => {
      const button = document.createElement("button");
      button.className = "game-button";
      button.textContent = game.name;

      button.addEventListener("click", () => {
        list.querySelectorAll("button").forEach(item => {
          item.classList.remove("active");
        });

        button.classList.add("active");
        placeholder.hidden = true;
        frame.hidden = false;
        frame.title = game.name;
        frame.src = game.path;
      });

      list.appendChild(button);
    });
  </script>
</body>
</html>
