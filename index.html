<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: #080808;
      color: #f5f5f5;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      width: 210px;
      flex-shrink: 0;
      padding: 28px 16px;
      background: #0d0d0d;
      border-right: 1px solid #202020;
    }

    .logo {
      margin: 0 10px 32px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav-item {
      padding: 12px 14px;
      border-radius: 10px;
      background: #1c1c1c;
      color: #fff;
      font-size: 14px;
    }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      padding: 32px;
      gap: 20px;
      animation: enter .6s both;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: -.04em;
    }

    p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .game-button {
      padding: 11px 18px;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      background: #151515;
      color: #bbb;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease,
                  border-color .2s ease, color .2s ease;
    }

    .game-button:hover {
      transform: translateY(-2px);
      border-color: #555;
      background: #202020;
      color: white;
    }

    .game-button:active { transform: scale(.97); }

    .game-button.active {
      border-color: #777;
      background: #292929;
      color: white;
    }

    .viewer {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #252525;
      border-radius: 16px;
      background: #101010;
    }

    .placeholder {
      display: grid;
      height: 100%;
      place-items: center;
      color: #666;
      font-size: 14px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      animation: enter .45s ease both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .sidebar { width: 90px; padding: 24px 10px; }
      .logo { margin-left: 4px; font-size: 11px; }
      .nav-item { padding: 10px; }
      main { padding: 20px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">my hub</div>
      <div class="nav-item">games</div>
    </aside>

    <main>
      <header>
        <h1>library</h1>
        <p>play</p>
      </header>

      <div id="gameList" class="game-list"></div>

      <div class="viewer">
        <div id="placeholder" class="placeholder">select a game</div>
        <iframe id="gameFrame" title="Game viewer" hidden></iframe>
      </div>
    </main>
  </div>

  <script>
    // Add more games here.
    const games = [
  { name: "snake", path: "games/snake/index.html" },
  { name: "2048", path: "games/2048/index.html" },
  { name: "flappy bird", path: "games/flappybird/index.html" },
  { name: "minesweeper", path: "games/minesweeper/index.html" },
  { name: "pong", path: "games/pong/index.html" },
  { name: "reaction test", path: "games/reaction/index.html" }
];

    const list = document.getElementById("gameList");
    const frame = document.getElementById("gameFrame");
    const placeholder = document.getElementById("placeholder");

    games.forEach(game => {
      const button = document.createElement("button");
      button.className = "game-button";
      button.textContent = game.name;

      button.addEventListener("click", () => {
        list.querySelectorAll("button").forEach(item => {
          item.classList.remove("active");
        });
        button.classList.add("active");
        placeholder.hidden = true;
        frame.hidden = false;
        frame.src = game.path;
      });

      list.appendChild(button);
    });
  </script>
</body>
</html>
