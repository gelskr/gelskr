<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" href="favicon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4; }
    header { background: #11111b; padding: 1rem; text-align: center; }
    header h1 { margin: 0; font-size: 1.6rem; }
    nav { display: flex; justify-content: center; gap: .5rem; background: #181825; padding: .6rem; }
    nav button { background: #313244; color: #cdd6f4; border: 0; padding: .6rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    nav button:hover { background: #45475a; }
    nav button.active { background: #89b4fa; color: #11111b; font-weight: bold; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .tab { display: none; }
    .tab.active { display: block; }
    input.search { width: 100%; padding: .7rem; margin-bottom: 1rem; border-radius: 6px; border: 0; font-size: 1rem; background: #313244; color: #cdd6f4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
    .card { background: #313244; padding: 1rem; border-radius: 8px; }
    .card a { color: #89b4fa; font-weight: bold; text-decoration: none; font-size: 1.05rem; }
    .card a:hover { text-decoration: underline; }
    .card p { margin: .4rem 0 0; font-size: .9rem; color: #a6adc8; }
  </style>
</head>
<body>

<header>
  <h1>My Start Page</h1>
</header>

<nav>
  <button class="active" data-tab="home">Home</button>
  <button data-tab="anime">Anime</button>
  <button data-tab="games">Games</button>
</nav>

<main>
  <section id="home" class="tab active">
    <h2>Welcome</h2>
    <p>Pick a tab above to browse anime and games.</p>
  </section>

  <section id="anime" class="tab">
    <h2>Anime</h2>
    <input type="text" class="search" data-list="animeList" placeholder="Search anime sites...">
    <div class="grid" id="animeList"></div>
  </section>

  <section id="games" class="tab">
    <h2>Games</h2>
    <input type="text" class="search" data-list="gamesList" placeholder="Search game sites...">
    <div class="grid" id="gamesList"></div>
  </section>
</main>

<script>
  // Edit these lists to add or change links
  const sites = {
    animeList: [
      { name: "Crunchyroll", url: "https://www.crunchyroll.com", desc: "Stream anime, many with official subtitles." },
      { name: "MyAnimeList", url: "https://myanimelist.net", desc: "Track what you watch and read reviews." },
      { name: "AniList", url: "https://anilist.co", desc: "Anime and manga tracker with recommendations." }
    ],
    gamesList: [
      { name: "Steam", url: "https://store.steampowered.com", desc: "Huge PC game library, many free to play." },
      { name: "itch.io", url: "https://itch.io", desc: "Indie games and game jam projects." },
      { name: "Epic Games Store", url: "https://store.epicgames.com", desc: "Free games every week." },
      { name: "Poki", url: "https://poki.com", desc: "Free browser games, no download needed." },
      { name: "Newgrounds", url: "https://www.newgrounds.com/games", desc: "Classic and independent browser games." }
    ]
  };

  // Render cards
  function render(listId, items) {
    document.getElementById(listId).innerHTML = items.map(i =>
      `<div class="card">
         <a href="${i.url}" target="_blank" rel="noopener noreferrer">${i.name}</a>
         <p>${i.desc}</p>
       </div>`
    ).join("");
  }

  // Tab switching
  document.querySelectorAll("nav button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  // Search filtering
  document.querySelectorAll("input.search").forEach(input => {
    input.addEventListener("input", () => {
      const q = input.value.toLowerCase();
      const listId = input.dataset.list;
      const filtered = sites[listId].filter(s =>
        s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q)
      );
      render(listId, filtered);
    });
  });

  // Initial render
  Object.keys(sites).forEach(id => render(id, sites[id]));
</script>

</body>
</html>
