<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games & Anime</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10111a;
      color: #f5f5ff;
    }

    .app {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    .sidebar {
      width: 200px;
      flex-shrink: 0;
      padding: 20px 12px;
      background: #191a28;
      border-right: 1px solid #303044;
    }

    .sidebar h2 {
      margin: 0 8px 24px;
      font-size: 20px;
    }

    .tab {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #c7c7d8;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .tab:hover { background: #292a40; }
    .tab.active { background: #7157e8; color: white; }

    main {
      flex: 1;
      min-width: 0;
      padding: 20px;
      overflow: auto;
    }

    .page { display: none; }
    .page.active {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 14px;
    }

    h1 { margin: 0; font-size: 24px; }
    p { margin: 0; color: #b4b4c8; line-height: 1.5; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 180px;
      padding: 11px;
      border: 1px solid #42425b;
      border-radius: 8px;
      background: #202132;
      color: white;
      font-size: 14px;
    }

    button, .open-link {
      padding: 11px 15px;
      border: 0;
      border-radius: 8px;
      background: #7157e8;
      color: white;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover, .open-link:hover { background: #856ff0; }

    .game-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .game-list button { background: #33344b; }
    .game-list button:hover { background: #4b4c6a; }

    iframe {
      flex: 1;
      width: 100%;
      min-height: 300px;
      border: 1px solid #38384e;
      border-radius: 8px;
      background: white;
    }

    @media (max-width: 600px) {
      .sidebar { width: 105px; padding: 15px 8px; }
      .sidebar h2 { font-size: 16px; }
      main { padding: 14px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <h2>My Hub</h2>
      <button class="tab active" data-page="games">🎮 Games</button>
      <button class="tab" data-page="anime">📺 Anime</button>
    </aside>

    <main>
      <section id="games" class="page active">
        <h1>Games</h1>
        <p>Choose a game to play.</p>
        <div id="gameList" class="game-list"></div>
        <iframe id="gameFrame" title="Game viewer"></iframe>
      </section>

      <section id="anime" class="page">
        <h1>Anime</h1>
        <p>Enter the address of a website you want to view.</p>
        <form id="animeForm" class="controls">
          <input
            id="animeUrl"
            type="url"
            placeholder="https://example.com"
            required
          >
          <button type="submit">Open</button>
          <a id="externalLink" class="open-link" target="_blank"
             rel="noopener noreferrer" hidden>Open in new tab</a>
        </form>
        <p>Some websites block being displayed inside another page. Use “Open in new tab” if that happens.</p>
        <iframe id="animeFrame" title="Anime website viewer"></iframe>
      </section>
    </main>
  </div>

  <script>
    // ADD YOUR GAMES HERE:
    // Put each game in its own folder inside the "games" folder.
    const games = [
      { name: "Game 1", path: "games/game1/index.html" },
      { name: "Game 2", path: "games/game2/index.html" }
    ];

    // Switch sidebar tabs.
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab, .page").forEach(element => {
          element.classList.remove("active");
        });
        tab.classList.add("active");
        document.getElementById(tab.dataset.page).classList.add("active");
      });
    });

    // Create a button for each game.
    const gameList = document.getElementById("gameList");
    const gameFrame = document.getElementById("gameFrame");

    games.forEach(game => {
      const button = document.createElement("button");
      button.textContent = game.name;
      button.addEventListener("click", () => {
        gameFrame.src = game.path;
      });
      gameList.appendChild(button);
    });

    // Save and display the selected anime website.
    const animeForm = document.getElementById("animeForm");
    const animeUrl = document.getElementById("animeUrl");
    const animeFrame = document.getElementById("animeFrame");
    const externalLink = document.getElementById("externalLink");

    function openAnimeSite(url) {
      const parsed = new URL(url);
      if (!["http:", "https:"].includes(parsed.protocol)) {
        throw new Error("Please enter an HTTP or HTTPS URL.");
      }
      animeFrame.src = parsed.href;
      externalLink.href = parsed.href;
      externalLink.hidden = false;
      localStorage.setItem("animeWebsite", parsed.href);
    }

    animeForm.addEventListener("submit", event => {
      event.preventDefault();
      try {
        openAnimeSite(animeUrl.value);
      } catch {
        alert("Please enter a valid URL starting with http:// or https://");
      }
    });

    const savedUrl = localStorage.getItem("animeWebsite");
    if (savedUrl) {
      animeUrl.value = savedUrl;
      try { openAnimeSite(savedUrl); } catch { /* Ignore invalid saved URLs. */ }
    }
  </script>
</body>
</html>
